<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#05090d" />
  <title>Watch Live | PlayFooty</title>
  <style>
    :root{--blue:#42b8ff;--ink:#05090d;--panel:#0d1924;--line:#263a49;--muted:#91a1ae}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05090d;color:#fff;font-family:Inter,Arial,sans-serif}button,a{font:inherit}
    body{background:radial-gradient(circle at top,#152a39 0,#07111c 43%,#030608 100%)}
    .shell{width:min(1180px,calc(100% - 24px));margin:auto;padding:18px 0 40px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand{color:#fff;text-decoration:none;font-weight:1000;font-style:italic;font-size:24px;letter-spacing:-1.3px}.brand b{color:var(--blue)}
    .share{display:flex;align-items:center;gap:7px;border:1px solid #355064;border-radius:999px;background:#101c26;color:#fff;padding:10px 14px;font-weight:900;text-transform:uppercase}
    .statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}.live-state{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase}.dot{width:10px;height:10px;border-radius:50%;background:#657582}.live .dot{background:#eb3348;box-shadow:0 0 0 6px rgba(235,51,72,.16)}.round{color:#b9c7d0;font-size:11px;font-weight:850;text-align:right}
    .player{position:relative;aspect-ratio:16/9;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:#000;box-shadow:0 24px 80px rgba(0,0,0,.48)}video{width:100%;height:100%;object-fit:contain;background:#000}.waiting{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:28px;background:linear-gradient(145deg,#101d28,#05090d)}.waiting[hidden]{display:none}.waiting strong{display:block;font-size:clamp(28px,5vw,54px);font-family:Impact,'Arial Narrow Bold',sans-serif;text-transform:uppercase}.waiting p{max-width:540px;margin:10px auto;color:var(--muted);line-height:1.5}.spinner{width:38px;height:38px;margin:0 auto 18px;border:4px solid #253746;border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .score{display:grid;grid-template-columns:minmax(0,1fr) 76px minmax(0,1fr);align-items:stretch;width:min(620px,calc(100% - 28px));min-height:64px;margin:-78px auto 0;position:relative;z-index:3;border-radius:9px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.55)}.team{display:grid;grid-template-columns:42px minmax(0,1fr);align-items:center;gap:8px;padding:7px 10px;background:#101c26;background-image:linear-gradient(90deg,rgba(3,8,13,.88),rgba(3,8,13,.62)),var(--cover,none);background-position:center;background-size:cover}.team.away{grid-template-columns:minmax(0,1fr) 42px;text-align:right;background-image:linear-gradient(270deg,rgba(3,8,13,.88),rgba(3,8,13,.62)),var(--cover,none)}.team img{width:42px;height:42px;object-fit:contain;display:none}.team img.show{display:block}.away img{grid-column:2}.away .copy{grid-column:1;grid-row:1}.copy{min-width:0}.copy small,.copy strong,.copy span{display:block}.copy small{font-size:8px;font-weight:950;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.copy strong{font-size:25px;line-height:1;font-weight:1000}.copy span{font-size:8px;color:#dce6ec}.centre{display:grid;place-items:center;align-content:center;background:var(--blue);color:#00131e;text-align:center}.centre b{font-size:16px}.centre span{font-family:monospace;font-size:10px;font-weight:1000}
    .below{display:grid;grid-template-columns:1fr auto;gap:14px;margin-top:28px;padding:17px;border:1px solid var(--line);border-radius:14px;background:rgba(13,25,36,.88)}.below h1{margin:0;font-family:Impact,'Arial Narrow Bold',sans-serif;font-size:clamp(30px,5vw,52px);text-transform:uppercase}.below p{margin:7px 0 0;color:var(--muted)}.club-link{align-self:center;color:#04121c;background:var(--blue);border-radius:999px;padding:11px 15px;text-decoration:none;font-weight:950;text-transform:uppercase;white-space:nowrap}.error{margin-top:12px;padding:12px;border:1px solid #7d2630;border-radius:10px;background:#351218;color:#ffd1d5;display:none}
    @media(max-width:700px){.shell{width:calc(100% - 12px);padding-top:8px}.player{border-radius:10px}.score{grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);width:calc(100% - 16px);min-height:52px;margin-top:-60px}.team{grid-template-columns:30px minmax(0,1fr);gap:4px;padding:5px 6px}.team.away{grid-template-columns:minmax(0,1fr) 30px}.team img{width:30px;height:30px}.copy small{font-size:6px}.copy strong{font-size:18px}.copy span{font-size:6px}.centre b{font-size:12px}.centre span{font-size:8px}.below{grid-template-columns:1fr}.club-link{justify-self:start}.share{padding:8px 10px;font-size:10px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><a class="brand" href="/"><b>PLAY</b>FOOTY</a><button class="share" id="shareButton" type="button">Share live room</button></header>
    <div class="statusbar"><div class="live-state" id="liveState"><i class="dot"></i><span>Waiting for broadcast</span></div><div class="round" id="roundLabel">PlayFooty Live</div></div>
    <section class="player">
      <video id="player" playsinline controls autoplay hidden></video>
      <div class="waiting" id="waiting"><div><div class="spinner"></div><strong>The broadcast will begin shortly</strong><p>Keep this page open. Video will start automatically when the club begins its PlayFooty broadcast.</p></div></div>
    </section>
    <section class="score">
      <div class="team" id="homeTeam"><img id="homeLogo" alt=""><div class="copy"><small id="homeName">Home</small><strong id="homeScore">0.0</strong><span id="homeTotal">0 points</span></div></div>
      <div class="centre"><b id="quarter">Q1</b><span id="clock">00:00</span></div>
      <div class="team away" id="awayTeam"><img id="awayLogo" alt=""><div class="copy"><small id="awayName">Away</small><strong id="awayScore">0.0</strong><span id="awayTotal">0 points</span></div></div>
    </section>
    <section class="below"><div><h1 id="title">Live community football</h1><p id="subtitle">Watch the match live on PlayFooty.</p></div><a class="club-link" id="clubLink" href="/">View club profile</a></section>
    <div class="error" id="error"></div>
  </main>
<script>
(() => {
  const params=new URLSearchParams(location.search),clubId=params.get('clubId')||''
  const $=id=>document.getElementById(id)
  let timer=0,currentPlayback=''
  $('clubLink').href=clubId?'/team/'+encodeURIComponent(clubId):'/'
  function total(g,b){return Number(g||0)*6+Number(b||0)}
  function fmt(seconds){seconds=Math.max(0,Math.floor(Number(seconds)||0));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
  function logo(id,url){const image=$(id);if(url){image.src=url;image.classList.add('show')}else{image.removeAttribute('src');image.classList.remove('show')}}
  function teamStyle(id,cover,colour){const node=$(id);node.style.backgroundColor=colour||'#101c26';node.style.setProperty('--cover',cover?'url("'+String(cover).replaceAll('"','%22')+'")':'none')}
  function playback(data){return data.playbackUrl||data.hlsUrl||data.streamPlaybackUrl||data.livePlaybackUrl||''}
  function render(data){
    const hg=Number(data.homeGoals)||0,hb=Number(data.homeBehinds)||0,ag=Number(data.awayGoals)||0,ab=Number(data.awayBehinds)||0
    $('homeName').textContent=data.clubName||'Home';$('awayName').textContent=data.opponentName||'Away';$('homeScore').textContent=hg+'.'+hb;$('awayScore').textContent=ag+'.'+ab;$('homeTotal').textContent=total(hg,hb)+' points';$('awayTotal').textContent=total(ag,ab)+' points';$('quarter').textContent='Q'+(data.quarter||1);$('clock').textContent=fmt(data.elapsedSeconds||0)
    $('roundLabel').textContent=data.roundLabel||data.matchDate||'PlayFooty Live';$('title').textContent=(data.clubName||'Home')+' v '+(data.opponentName||'Away');$('subtitle').textContent=data.lastEvent||'Live scores and broadcast on PlayFooty.'
    logo('homeLogo',data.homeLogoUrl);logo('awayLogo',data.awayLogoUrl);teamStyle('homeTeam',data.homeCoverUrl,data.homePrimaryColour);teamStyle('awayTeam',data.awayCoverUrl,data.awayPrimaryColour)
    const url=playback(data),isLive=Boolean(url||data.streamStatus==='LIVE'||data.isStreaming===true)
    $('liveState').classList.toggle('live',isLive);$('liveState').querySelector('span').textContent=isLive?'Live now':'Waiting for broadcast'
    if(url&&url!==currentPlayback){currentPlayback=url;const video=$('player');video.src=url;video.hidden=false;$('waiting').hidden=true;video.play().catch(()=>{})}
    if(!url){$('player').hidden=true;$('waiting').hidden=false}
  }
  async function load(){
    if(!clubId){$('error').style.display='block';$('error').textContent='This live room is missing a club ID.';return}
    try{const response=await fetch('/api/live-match/clubs/'+encodeURIComponent(clubId)+'?watch='+Date.now(),{cache:'no-store',headers:{'cache-control':'no-cache'}});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Live match unavailable');render(payload.data||payload);$('error').style.display='none'}catch(error){$('error').style.display='block';$('error').textContent=error instanceof Error?error.message:'Unable to load this live room'}
  }
  $('shareButton').addEventListener('click',async()=>{const title=$('title').textContent||'Watch live on PlayFooty',text='Watch '+title+' live on PlayFooty.';try{if(navigator.share)await navigator.share({title,text,url:location.href});else{await navigator.clipboard.writeText(location.href);$('shareButton').textContent='Link copied';setTimeout(()=>$('shareButton').textContent='Share live room',1800)}}catch(error){if(error?.name!=='AbortError')alert('Unable to share this link.') }})
  load();timer=setInterval(load,1000);window.addEventListener('beforeunload',()=>clearInterval(timer))
})()
</script>
</body>
</html>
