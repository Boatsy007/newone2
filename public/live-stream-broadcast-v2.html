<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#05090d" />
  <title>PlayFooty Live Broadcast Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090d;font-family:Inter,Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#05090d}
    .swap-visual{position:fixed;left:max(14px,env(safe-area-inset-left));bottom:max(88px,calc(env(safe-area-inset-bottom) + 70px));z-index:12000;width:min(460px,calc(100vw - 28px));pointer-events:none;opacity:0;visibility:hidden;transform:translateX(calc(-100% - 28px));transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .2s ease,visibility .2s ease}
    .swap-visual.show{opacity:1;visibility:visible;transform:translateX(0)}
    .swap-card{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;padding:11px 14px;border:1px solid rgba(255,255,255,.22);border-left:5px solid var(--swap-colour,#2daaf5);border-radius:14px;background:linear-gradient(100deg,rgba(3,9,14,.96),rgba(3,9,14,.88)),var(--swap-cover,none);background-position:center;background-size:cover;box-shadow:0 14px 38px rgba(0,0,0,.52);color:#fff;overflow:hidden;backdrop-filter:blur(12px)}
    .swap-card:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,color-mix(in srgb,var(--swap-colour,#2daaf5) 24%,transparent),transparent 58%);pointer-events:none}.swap-card>*{position:relative;z-index:1}
    .swap-logo{display:none;width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 5px 10px rgba(0,0,0,.62))}.swap-logo.show{display:block}
    .swap-copy{min-width:0}.swap-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}.swap-team{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:1000;letter-spacing:.13em;text-transform:uppercase;color:#dcecf5}.swap-title{font-size:9px;font-weight:1000;letter-spacing:.14em;text-transform:uppercase;color:#8fcff5}
    .swap-players{display:grid;gap:5px}.swap-player{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px;min-width:0}.swap-player small{display:grid;place-items:center;height:22px;border-radius:6px;font-size:9px;font-weight:1000;letter-spacing:.08em;text-transform:uppercase}.swap-player strong{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;line-height:1.05;text-transform:uppercase}.swap-player.off small{background:#6f2028;color:#ffd9dc}.swap-player.on small{background:#176b45;color:#d8ffec}
    @media(max-width:620px){.swap-visual{left:8px;bottom:max(76px,calc(env(safe-area-inset-bottom) + 66px));width:min(390px,calc(100vw - 16px))}.swap-card{gap:9px;padding:9px 10px;border-radius:11px}.swap-logo{width:42px;height:42px}.swap-player{grid-template-columns:38px minmax(0,1fr);gap:6px}.swap-player small{height:20px;font-size:8px}.swap-player strong{font-size:13px}.swap-head{margin-bottom:5px}.swap-team{font-size:8px}.swap-title{font-size:8px}}
    @media(prefers-reduced-motion:reduce){.swap-visual{transition:none}}
  </style>
</head>
<body>
  <iframe id="broadcast" title="PlayFooty Live Broadcast Studio" allow="camera; microphone; fullscreen; autoplay"></iframe>
  <section class="swap-visual" id="swapVisual" aria-live="polite">
    <article class="swap-card">
      <img class="swap-logo" id="swapLogo" alt="" />
      <div class="swap-copy">
        <div class="swap-head"><div class="swap-team" id="swapTeam">Your Team</div><div class="swap-title">Interchange</div></div>
        <div class="swap-players">
          <div class="swap-player off"><small>Off</small><strong id="playerOff"></strong></div>
          <div class="swap-player on"><small>On</small><strong id="playerOn"></strong></div>
        </div>
      </div>
    </article>
  </section>
<script>
(() => {
  const broadcast=document.getElementById('broadcast')
  const visual=document.getElementById('swapVisual')
  const logo=document.getElementById('swapLogo')
  const clubId=new URLSearchParams(location.search).get('clubId')||''
  let ready=false,lastEvent='',hideTimer=0,inspectTimer=0,pollInFlight=false,rawSwapObserver=null,operatorSyncTimer=0,operatorRecording=false
  broadcast.src='/live-stream-broadcast.html'+(location.search||'')

  function text(doc,id){return String(doc?.getElementById(id)?.textContent||'').trim()}
  function innerStudio(){
    const broadcastDoc=broadcast.contentDocument
    const studio=broadcastDoc?.getElementById('studio')
    return studio?.contentDocument||null
  }
  function operatorSource(){
    try{
      const parentWindow=window.parent
      const parentDoc=parentWindow?.document
      const mark=parentDoc?.getElementById('highlightButton')
      const clips=parentDoc?.getElementById('clipsButton')
      const count=parentDoc?.getElementById('clipCount')
      return mark&&clips&&count?{window:parentWindow,mark,clips,count}:null
    }catch{return null}
  }
  function cameraStream(){
    const doc=innerStudio()
    const stream=doc?.getElementById('video')?.srcObject
    return stream&&typeof stream.getTracks==='function'?stream:null
  }
  function installOperatorControls(){
    const doc=innerStudio()
    const source=operatorSource()
    if(!doc||!source)return false
    let style=doc.getElementById('fullscreen-operator-highlight-style')
    if(!style){
      style=doc.createElement('style')
      style.id='fullscreen-operator-highlight-style'
      style.textContent=`
        .operator-highlight-controls{display:none;position:fixed;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:2147483647;gap:8px;align-items:center;pointer-events:auto}
        .stage-fullscreen .operator-highlight-controls{display:flex!important}
        .operator-highlight-controls button{min-height:38px;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 13px;background:rgba(4,10,16,.94);color:#fff;font:900 11px/1 Inter,Arial,sans-serif;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
        .operator-highlight-controls .mark{background:#d42d3b;border-color:#ef6671}.operator-highlight-controls .mark.recording{background:#831821}.operator-highlight-controls button:disabled{opacity:.48}
        .operator-highlight-controls .count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;border-radius:999px;background:#2daaf5;color:#04121c;font-size:10px}
        .operator-record-start{display:grid;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2147483646;min-width:190px;min-height:58px;place-items:center;border:1px solid rgba(255,255,255,.38);border-radius:999px;padding:14px 24px;background:#d42d3b;color:#fff;font:1000 15px/1 Inter,Arial,sans-serif;text-transform:uppercase;box-shadow:0 12px 36px rgba(0,0,0,.62)}
        .operator-record-end{display:none;position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:2147483647;min-height:38px;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:9px 13px;background:rgba(4,10,16,.94);color:#fff;font:900 11px/1 Inter,Arial,sans-serif;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.55)}
        .operator-recording .operator-record-start{display:none!important}.operator-recording .operator-record-end{display:block!important}
        .operator-recording .operator-highlight-controls .mark{opacity:1}.operator-not-recording .operator-highlight-controls .mark{opacity:.48}
        @media(max-width:620px){.operator-highlight-controls{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left));gap:6px}.operator-highlight-controls button{min-height:34px;padding:8px 10px;font-size:10px}.operator-record-start{min-width:170px;min-height:52px;font-size:13px}.operator-record-end{left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));min-height:34px;padding:8px 10px;font-size:10px}}
      `
      doc.head.appendChild(style)
    }
    let controls=doc.getElementById('fullscreenOperatorHighlights')
    if(!controls){
      controls=doc.createElement('div')
      controls.id='fullscreenOperatorHighlights'
      controls.className='operator-highlight-controls'
      controls.innerHTML='<button class="mark" id="fullscreenMarkHighlight" type="button">Mark Highlight</button><button id="fullscreenClips" type="button">Clips <span class="count" id="fullscreenClipCount">0</span></button>'
      doc.body.appendChild(controls)
    }
    let start=doc.getElementById('operatorStartRecording')
    if(!start){
      start=doc.createElement('button')
      start.id='operatorStartRecording';start.className='operator-record-start';start.type='button';start.textContent='Start Recording';doc.body.appendChild(start)
    }
    let end=doc.getElementById('operatorEndRecording')
    if(!end){
      end=doc.createElement('button')
      end.id='operatorEndRecording';end.className='operator-record-end';end.type='button';end.textContent='End Recording';doc.body.appendChild(end)
    }
    const mark=doc.getElementById('fullscreenMarkHighlight')
    const clips=doc.getElementById('fullscreenClips')
    if(mark.dataset.bound!=='1'){
      mark.dataset.bound='1'
      mark.addEventListener('click',()=>{
        if(!operatorRecording)return
        const cameraDoc=innerStudio()
        const stream=cameraStream()
        if(!stream)return
        try{source.window.MediaStream=cameraDoc.defaultView.MediaStream}catch{}
        source.mark.click()
      })
      clips.addEventListener('click',()=>source.clips.click())
      start.addEventListener('click',()=>{
        const stream=cameraStream()
        const live=stream?.getTracks().some(track=>track.readyState==='live')
        if(!live){source.mark.click();return}
        operatorRecording=true
        doc.body.classList.add('operator-recording');doc.body.classList.remove('operator-not-recording')
      })
      end.addEventListener('click',()=>{
        operatorRecording=false
        doc.body.classList.remove('operator-recording');doc.body.classList.add('operator-not-recording')
      })
    }
    doc.body.classList.toggle('operator-recording',operatorRecording)
    doc.body.classList.toggle('operator-not-recording',!operatorRecording)
    clearInterval(operatorSyncTimer)
    const sync=()=>{
      const liveSource=operatorSource()
      const markButton=doc.getElementById('fullscreenMarkHighlight')
      const clipCount=doc.getElementById('fullscreenClipCount')
      if(!liveSource||!markButton||!clipCount)return
      markButton.textContent=liveSource.mark.textContent||'Mark Highlight'
      markButton.disabled=!operatorRecording||Boolean(liveSource.mark.disabled)
      markButton.classList.toggle('recording',liveSource.mark.classList.contains('recording'))
      clipCount.textContent=liveSource.count.textContent||'0'
    }
    sync();operatorSyncTimer=setInterval(sync,250)
    return true
  }
  function assets(doc){
    const panel=doc?.getElementById('homeTeam'),image=doc?.getElementById('homeLogo')
    return{team:text(doc,'homeName')||'Your Team',logo:image?.src||'',cover:panel?.style.getPropertyValue('--team-cover')||'none',colour:panel?.style.getPropertyValue('--team-colour')||'#2daaf5'}
  }
  function parseSwap(event){const match=String(event||'').match(/^(.+?)\s+swapped\s+with\s+(.+)$/i);return match?{off:match[1].trim(),on:match[2].trim()}:null}
  function suppressRawSwapLabel(){
    const latest=innerStudio()?.getElementById('latest');if(!latest)return false
    const clearSwap=()=>{if(parseSwap(latest.textContent))latest.textContent=''}
    clearSwap();rawSwapObserver?.disconnect();rawSwapObserver=new MutationObserver(clearSwap);rawSwapObserver.observe(latest,{childList:true,characterData:true,subtree:true});return true
  }
  function showSwap(swap,brand){
    clearTimeout(hideTimer);document.getElementById('swapTeam').textContent=brand.team;document.getElementById('playerOff').textContent=swap.off;document.getElementById('playerOn').textContent=swap.on
    visual.style.setProperty('--swap-colour',brand.colour);visual.style.setProperty('--swap-cover',brand.cover||'none')
    if(brand.logo){logo.src=brand.logo;logo.classList.add('show')}else{logo.removeAttribute('src');logo.classList.remove('show')}
    requestAnimationFrame(()=>visual.classList.add('show'));hideTimer=setTimeout(()=>visual.classList.remove('show'),4200)
  }
  async function inspect(){
    installOperatorControls();suppressRawSwapLabel();if(!clubId||pollInFlight)return;pollInFlight=true
    try{
      const response=await fetch('/api/live-match/clubs/'+encodeURIComponent(clubId)+'?eventPoll='+Date.now(),{cache:'no-store',headers:{'cache-control':'no-cache'}});if(!response.ok)return
      const payload=await response.json(),event=String((payload.data||payload)?.lastEvent||'').trim()
      if(!ready){lastEvent=event;ready=true;return}
      if(event&&event!==lastEvent){const swap=parseSwap(event);if(swap)showSwap(swap,assets(innerStudio()))}
      lastEvent=event||lastEvent
    }catch{}finally{pollInFlight=false}
  }
  broadcast.addEventListener('load',()=>{ready=false;clearInterval(inspectTimer);installOperatorControls();suppressRawSwapLabel();inspect();inspectTimer=setInterval(inspect,300)})
  window.addEventListener('beforeunload',()=>{clearInterval(inspectTimer);clearInterval(operatorSyncTimer);rawSwapObserver?.disconnect()})
})()
</script>
</body>
</html>
