<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#05090d" />
  <title>PlayFooty Live Broadcast Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090d;font-family:Inter,Arial,sans-serif;color:#fff}iframe{display:block;width:100%;height:100%;border:0;background:#05090d}
    .highlight-controls{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:15000;display:flex;gap:8px;align-items:center}.highlight-button,.clips-button{border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(4,10,16,.9);color:#fff;padding:12px 16px;font-weight:950;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(12px)}.highlight-button{background:#d42d3b;border-color:#ef6671}.highlight-button.recording{background:#831821;animation:pulse 1s ease-in-out infinite}.highlight-button:disabled{opacity:.52}.clips-button span{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;border-radius:999px;background:#2daaf5;color:#04121c;font-size:10px}
    .toast{position:fixed;left:50%;bottom:78px;z-index:15010;max-width:min(520px,90vw);transform:translateX(-50%);padding:10px 14px;border-radius:10px;background:rgba(4,10,16,.94);border:1px solid rgba(255,255,255,.18);font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.drawer{position:fixed;inset:0 0 0 auto;z-index:16000;width:min(440px,100vw);padding:max(18px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));background:#07111c;border-left:1px solid #273b4a;box-shadow:-18px 0 60px rgba(0,0,0,.5);transform:translateX(105%);transition:transform .25s ease;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.drawer h2{margin:0;font-size:25px}.drawer-head button{border:1px solid #344957;border-radius:9px;background:#101c26;color:#fff;padding:8px 11px;font-weight:900}.drawer-empty,.library-error{margin-top:20px;padding:18px;border:1px dashed #344957;border-radius:12px;color:#91a1ae;text-align:center}.library-heading{display:flex;justify-content:space-between;align-items:center;margin:20px 0 4px;padding-top:16px;border-top:1px solid #233440}.library-heading strong{font-size:14px}.library-heading span{color:#91a1ae;font-size:10px;text-transform:uppercase;letter-spacing:.1em}
    .clip{margin-top:12px;padding:12px;border:1px solid #263a49;border-radius:14px;background:#0d1924}.clip video{width:100%;max-height:230px;border-radius:10px;background:#000}.clip-meta{display:grid;gap:4px;margin:10px 0;color:#c4d0d8;font-size:11px}.clip-meta strong{color:#fff;font-size:13px}.clip-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.clip-actions button,.clip-actions a{display:grid;place-items:center;min-height:42px;border:1px solid #344957;border-radius:9px;background:#111d28;color:#fff;text-decoration:none;font-weight:900;font-size:11px;text-align:center}.clip-actions .share{background:#2daaf5;color:#03131e;border-color:#2daaf5}.clip-actions .library{background:#176b45;border-color:#249761}.clip-actions .library:disabled{opacity:.6}.clip-actions .saved{background:#183425;border-color:#2b6846;color:#9ef0be}.remote .clip-actions{grid-template-columns:1fr}.remote .clip-actions a{background:#2daaf5;color:#03131e;border-color:#2daaf5}
    @keyframes pulse{50%{transform:scale(.96);box-shadow:0 0 0 8px rgba(212,45,59,.18)}}@media(max-width:620px){.highlight-controls{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto}.highlight-button,.clips-button{padding:11px 12px}.toast{bottom:74px}.clip-actions{grid-template-columns:1fr 1fr}.clip-actions .library{grid-column:1/-1}}
  </style>
</head>
<body>
  <iframe id="interchange" title="PlayFooty Live Broadcast Studio" allow="camera; microphone; fullscreen; autoplay"></iframe>
  <div class="highlight-controls"><button class="highlight-button" id="highlightButton" type="button">Mark Highlight</button><button class="clips-button" id="clipsButton" type="button">Clips <span id="clipCount">0</span></button></div>
  <div class="toast" id="toast"></div>
  <aside class="drawer" id="drawer" aria-label="Captured highlights">
    <div class="drawer-head"><div><small>PLAYFOOTY MEDIA</small><h2>Match highlights</h2></div><button id="closeDrawer" type="button">Close</button></div>
    <div id="clipList"><div class="drawer-empty">No highlights captured yet. Start the camera, then tap Mark Highlight.</div></div>
    <div class="library-heading"><strong>Saved Media Library</strong><span>Shared across devices</span></div>
    <div id="libraryList"><div class="drawer-empty">Loading saved highlights…</div></div>
  </aside>
<script>
(() => {
  const SESSION_KEY='playfooty.clubPortal.session.v1'
  const frame=document.getElementById('interchange'),button=document.getElementById('highlightButton'),drawer=document.getElementById('drawer'),list=document.getElementById('clipList'),libraryList=document.getElementById('libraryList'),count=document.getElementById('clipCount'),toast=document.getElementById('toast')
  const query=new URLSearchParams(location.search),clubId=query.get('clubId')||''
  let clips=[],saved=[],recording=false,toastTimer=0
  frame.src='/live-stream-broadcast-v2.html'+(location.search||'')

  function accessToken(){try{const raw=localStorage.getItem(SESSION_KEY);const session=raw?JSON.parse(raw):null;return typeof session?.access_token==='string'?session.access_token:''}catch{return''}}
  function headers(json=false){const value={authorization:'Bearer '+accessToken()};if(json)value['content-type']='application/json';return value}
  function showToast(message){clearTimeout(toastTimer);toast.textContent=message;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),3000)}
  function studioDoc(){const v2=frame.contentDocument;const broadcast=v2?.getElementById('broadcast')?.contentDocument;return broadcast?.getElementById('studio')?.contentDocument||null}
  function cameraStream(){const video=studioDoc()?.getElementById('video');return video?.srcObject instanceof MediaStream?video.srcObject:null}
  function text(doc,id){return String(doc?.getElementById(id)?.textContent||'').trim()}
  function metadata(){const doc=studioDoc();return{title:text(doc,'title')||'Match highlight',quarter:text(doc,'quarter')||'Q1',clock:text(doc,'clock')||'00:00',home:text(doc,'homeName')||'Your team',homeScore:text(doc,'homeScore')||'0.0',away:text(doc,'awayName')||'Opposition',awayScore:text(doc,'awayScore')||'0.0',event:text(doc,'latest')||'Highlight marked',capturedAt:new Date()}}
  function mimeType(){const options=['video/mp4;codecs=h264,aac','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];return options.find(value=>window.MediaRecorder?.isTypeSupported?.(value))||''}
  function extension(type){return type.includes('mp4')?'mp4':type.includes('quicktime')?'mov':'webm'}
  function safeName(value){return String(value||'highlight').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase().slice(0,80)||'highlight'}
  function description(meta){return `${meta.quarter} · ${meta.clock}\n${meta.home} ${meta.homeScore} — ${meta.awayScore} ${meta.away}\n${meta.event}`}

  async function markHighlight(){
    if(recording)return
    const source=cameraStream();if(!source){showToast('Start the camera before marking a highlight.');return}if(!window.MediaRecorder){showToast('Highlight recording is not supported by this browser.');return}
    const tracks=source.getTracks().filter(track=>track.readyState==='live');if(!tracks.length){showToast('The camera stream is not active.');return}
    const capture=new MediaStream(tracks),type=mimeType();let recorder
    try{recorder=type?new MediaRecorder(capture,{mimeType:type}):new MediaRecorder(capture)}catch{showToast('This camera format cannot be recorded on this device.');return}
    const chunks=[],meta=metadata();recording=true;button.disabled=true;button.classList.add('recording');button.textContent='Capturing 12s…'
    recorder.ondataavailable=event=>{if(event.data&&event.data.size)chunks.push(event.data)}
    recorder.onerror=()=>{recording=false;button.disabled=false;button.classList.remove('recording');button.textContent='Mark Highlight';showToast('The highlight could not be recorded.')}
    recorder.onstop=()=>{recording=false;button.disabled=false;button.classList.remove('recording');button.textContent='Mark Highlight';if(!chunks.length){showToast('No video data was captured.');return}const actualType=recorder.mimeType||type||'video/webm',blob=new Blob(chunks,{type:actualType}),url=URL.createObjectURL(blob);clips.unshift({id:crypto.randomUUID(),blob,url,type:actualType,meta,uploading:false,uploaded:false});while(clips.length>6){const removed=clips.pop();if(removed)URL.revokeObjectURL(removed.url)}renderClips();drawer.classList.add('open');showToast('Highlight captured and ready to save.')}
    recorder.start(250);showToast('Capturing the next 12 seconds…');setTimeout(()=>{if(recorder.state!=='inactive')recorder.stop()},12000)
  }

  async function shareClip(clip){const ext=extension(clip.type),file=new File([clip.blob],safeName(`${clip.meta.quarter}-${clip.meta.clock}-${clip.meta.event}`)+'.'+ext,{type:clip.type});if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({title:'PlayFooty match highlight',text:`${clip.meta.home} ${clip.meta.homeScore} — ${clip.meta.awayScore} ${clip.meta.away} · ${clip.meta.quarter} ${clip.meta.clock}`,files:[file]})}catch(error){if(error?.name!=='AbortError')showToast('Share was unavailable. Use Save Clip instead.')}}else showToast('Sharing is unavailable here. Use Save Clip instead.')}

  async function saveToLibrary(clip){
    if(clip.uploading||clip.uploaded)return
    if(!clubId||!accessToken()){showToast('Your Club HQ session is required to save highlights.');return}
    clip.uploading=true;renderClips();showToast('Uploading highlight to Media Library…')
    try{
      const prepare=await fetch(`/api/club-portal/media/clubs/${encodeURIComponent(clubId)}/signed-upload`,{method:'POST',headers:headers(true),body:JSON.stringify({contentType:clip.type,fileSize:clip.blob.size})})
      const prepared=await prepare.json();if(!prepare.ok)throw new Error(prepared.error||'Unable to prepare upload')
      const upload=await fetch(prepared.data.uploadUrl,{method:'PUT',headers:{'content-type':clip.type,'x-upsert':'false'},body:clip.blob})
      if(!upload.ok)throw new Error(`Video upload failed: HTTP ${upload.status}`)
      const meta=clip.meta,title=`${meta.event} · ${meta.quarter} ${meta.clock}`
      const complete=await fetch(`/api/club-portal/media/clubs/${encodeURIComponent(clubId)}/complete-upload`,{method:'POST',headers:headers(true),body:JSON.stringify({id:prepared.data.id,path:prepared.data.path,contentType:clip.type,fileSize:clip.blob.size,title,description:description(meta),tags:['highlight','live-match',meta.quarter,meta.event],sourceEntityId:new URLSearchParams(location.search).get('sheetId')||null})})
      const completed=await complete.json();if(!complete.ok)throw new Error(completed.error||'Unable to save Media Library record')
      clip.uploaded=true;clip.uploading=false;renderClips();await loadLibrary();showToast('Highlight saved to the shared Media Library.')
    }catch(error){clip.uploading=false;renderClips();showToast(error instanceof Error?error.message:'Highlight upload failed.')}
  }

  async function loadLibrary(){
    if(!clubId||!accessToken()){libraryList.innerHTML='<div class="library-error">Sign in to Club HQ to load saved highlights.</div>';return}
    try{const response=await fetch(`/api/club-portal/media/clubs/${encodeURIComponent(clubId)}?type=HIGHLIGHT&status=READY&t=${Date.now()}`,{cache:'no-store',headers:headers()});const payload=await response.json();if(!response.ok)throw new Error(payload.error||'Unable to load highlights');saved=Array.isArray(payload.data)?payload.data:[];renderLibrary()}catch(error){libraryList.innerHTML=`<div class="library-error">${error instanceof Error?error.message:'Unable to load saved highlights.'}</div>`}
  }

  function renderClips(){
    count.textContent=String(clips.length+saved.length)
    if(!clips.length){list.innerHTML='<div class="drawer-empty">No new highlights in this session. Start the camera, then tap Mark Highlight.</div>';return}
    list.innerHTML='';clips.forEach(clip=>{const ext=extension(clip.type),article=document.createElement('article');article.className='clip';const video=document.createElement('video');video.controls=true;video.playsInline=true;video.src=clip.url;const meta=document.createElement('div');meta.className='clip-meta';meta.innerHTML=`<strong>${clip.meta.event}</strong><span>${clip.meta.quarter} · ${clip.meta.clock}</span><span>${clip.meta.home} ${clip.meta.homeScore} — ${clip.meta.awayScore} ${clip.meta.away}</span>`;const actions=document.createElement('div');actions.className='clip-actions';const share=document.createElement('button');share.className='share';share.type='button';share.textContent='Share';share.onclick=()=>shareClip(clip);const save=document.createElement('a');save.href=clip.url;save.download=safeName(`${clip.meta.quarter}-${clip.meta.clock}-${clip.meta.event}`)+'.'+ext;save.textContent='Save Clip';const library=document.createElement('button');library.type='button';library.className='library'+(clip.uploaded?' saved':'');library.disabled=clip.uploading||clip.uploaded;library.textContent=clip.uploaded?'Saved to Library':clip.uploading?'Uploading…':'Save to Media Library';library.onclick=()=>saveToLibrary(clip);actions.append(share,save,library);article.append(video,meta,actions);list.appendChild(article)})
  }

  function renderLibrary(){
    count.textContent=String(clips.length+saved.length)
    if(!saved.length){libraryList.innerHTML='<div class="drawer-empty">No highlights have been saved to the club library yet.</div>';return}
    libraryList.innerHTML='';saved.forEach(asset=>{const article=document.createElement('article');article.className='clip remote';const video=document.createElement('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.src=asset.fileUrl;const meta=document.createElement('div');meta.className='clip-meta';meta.innerHTML=`<strong>${asset.title||'Match highlight'}</strong><span>${String(asset.description||'').replaceAll('\n',' · ')}</span>`;const actions=document.createElement('div');actions.className='clip-actions';const open=document.createElement('a');open.href=asset.fileUrl;open.target='_blank';open.rel='noopener';open.textContent='Open saved highlight';actions.append(open);article.append(video,meta,actions);libraryList.appendChild(article)})
  }

  button.addEventListener('click',markHighlight);document.getElementById('clipsButton').addEventListener('click',()=>{drawer.classList.add('open');loadLibrary()});document.getElementById('closeDrawer').addEventListener('click',()=>drawer.classList.remove('open'));window.addEventListener('beforeunload',()=>clips.forEach(clip=>URL.revokeObjectURL(clip.url)));loadLibrary()
})()
</script>
</body>
</html>
