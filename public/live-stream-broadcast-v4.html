<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#05090d" />
  <title>PlayFooty Live Broadcast Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090d;font-family:Inter,Arial,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#05090d}
  </style>
</head>
<body>
  <iframe id="studio" title="PlayFooty Live Broadcast Studio" allow="camera; microphone; fullscreen; autoplay"></iframe>
  <script>
  (()=>{
    const studio=document.getElementById('studio')
    studio.src='/live-stream-broadcast-v3.html'+(location.search||'')
    let installTimer=0

    function deepestStudio(){
      try{
        const v3=studio.contentDocument
        const v2=v3?.getElementById('interchange')?.contentDocument
        const broadcast=v2?.getElementById('broadcast')?.contentDocument
        return broadcast?.getElementById('studio')?.contentDocument||null
      }catch{return null}
    }

    function setStageFullscreen(doc,active){
      doc.body.classList.toggle('pf-stage-fullscreen',active)
      doc.documentElement.classList.toggle('pf-stage-fullscreen-root',active)
      const button=doc.getElementById('playfootyStageFullscreen')
      if(button){
        button.setAttribute('aria-label',active?'Exit fullscreen':'Enter fullscreen')
        button.setAttribute('aria-pressed',String(active))
        button.innerHTML=active
          ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>'
          : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>'
      }
      try{
        if(active)screen.orientation?.lock?.('landscape').catch(()=>{})
        else screen.orientation?.unlock?.()
      }catch{}
    }

    async function toggleStageFullscreen(doc,stage){
      const active=doc.body.classList.contains('pf-stage-fullscreen')
      if(active){
        if(doc.fullscreenElement&&doc.exitFullscreen){try{await doc.exitFullscreen()}catch{}}
        setStageFullscreen(doc,false)
        return
      }
      if(stage.requestFullscreen&&doc.fullscreenEnabled){
        try{await stage.requestFullscreen();return}catch{}
      }
      setStageFullscreen(doc,true)
    }

    function install(){
      const doc=deepestStudio()
      const stage=doc?.getElementById('stage')
      if(!doc||!stage)return false

      stage.querySelectorAll('.top-bug,.pf-live-watermark,.playfooty-live-watermark,#playfootyBroadcastWatermark').forEach(node=>node.remove())
      doc.getElementById('fullBtn')?.style.setProperty('display','none','important')

      let style=doc.getElementById('playfooty-broadcast-shell-style')
      if(!style){
        style=doc.createElement('style')
        style.id='playfooty-broadcast-shell-style'
        style.textContent=`
          #playfootyBroadcastWatermark{position:absolute;top:10px;right:10px;z-index:120;display:flex;align-items:center;gap:6px;pointer-events:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.78));opacity:.96;transform:none!important;animation:none!important;transition:none!important}
          #playfootyBroadcastWatermark *{animation:none!important;transition:none!important}
          #playfootyBroadcastWatermark .pf-broadcast-logo{display:block;width:clamp(92px,13vw,150px);height:auto;object-fit:contain;opacity:1!important}
          #playfootyBroadcastWatermark .pf-broadcast-live{display:flex;align-items:center;gap:5px;padding:4px 7px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(4,9,14,.86);color:#fff;font-size:9px;font-weight:1000;letter-spacing:.12em;line-height:1;text-transform:uppercase}
          #playfootyBroadcastWatermark .pf-broadcast-dot{display:block;width:7px;height:7px;border-radius:50%;background:#f04451}

          #stage .overlay{left:50%!important;right:auto!important;bottom:10px!important;width:min(500px,calc(100% - 110px))!important;transform:translateX(-50%)!important;grid-template-columns:minmax(0,1fr) 62px minmax(0,1fr)!important;border-radius:7px!important;box-shadow:0 5px 20px rgba(0,0,0,.5)!important}
          #stage .team{gap:5px!important;padding:5px 7px!important;min-height:48px!important}
          #stage .team-logo{width:27px!important;height:27px!important}
          #stage .team small{font-size:6px!important;line-height:1.05!important}
          #stage .team strong{font-size:20px!important;line-height:.95!important}
          #stage .team span{font-size:7px!important;line-height:1!important}
          #stage .centre{min-width:62px!important;padding:4px 6px!important}
          #stage .centre b{font-size:13px!important}
          #stage .centre span{font-size:9px!important}
          #stage .latest{bottom:67px!important;max-width:min(410px,65%)!important}

          #playfootyStageFullscreen{position:absolute;right:10px;left:auto;bottom:10px;z-index:180;display:grid!important;place-items:center;width:38px;height:38px;padding:0;border:1px solid rgba(255,255,255,.62);border-radius:8px;background:rgba(3,8,13,.92);color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.65);cursor:pointer;visibility:visible!important;opacity:1!important;-webkit-appearance:none;appearance:none}
          #playfootyStageFullscreen svg{display:block;width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
          #fullBtn{display:none!important}

          html.pf-stage-fullscreen-root,html.pf-stage-fullscreen-root body{width:100%!important;height:100%!important;min-height:100%!important;overflow:hidden!important;background:#000!important}
          body.pf-stage-fullscreen .app{display:block!important;width:100%!important;height:100%!important;min-height:100%!important;background:#000!important}
          body.pf-stage-fullscreen header,body.pf-stage-fullscreen .controls,body.pf-stage-fullscreen .setup,body.pf-stage-fullscreen footer{display:none!important}
          body.pf-stage-fullscreen main{position:fixed!important;inset:0!important;z-index:2147483000!important;width:100vw!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:0!important;background:#000!important}
          body.pf-stage-fullscreen #stage{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;max-height:none!important;aspect-ratio:auto!important;border:0!important;border-radius:0!important;background:#000!important}
          body.pf-stage-fullscreen #stage video{width:100%!important;height:100%!important;object-fit:cover!important}
          body.pf-stage-fullscreen #playfootyStageFullscreen{right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom))}

          @media(max-width:700px){
            #playfootyBroadcastWatermark{top:7px;right:7px;gap:4px}
            #playfootyBroadcastWatermark .pf-broadcast-logo{width:88px}
            #playfootyBroadcastWatermark .pf-broadcast-live{padding:3px 5px;font-size:7px}
            #playfootyBroadcastWatermark .pf-broadcast-dot{width:6px;height:6px}
            #stage .overlay{bottom:7px!important;width:min(390px,calc(100% - 96px))!important;grid-template-columns:minmax(0,1fr) 54px minmax(0,1fr)!important}
            #stage .team{gap:3px!important;padding:4px 5px!important;min-height:44px!important}
            #stage .team-logo{width:23px!important;height:23px!important}
            #stage .team small{font-size:5.5px!important}
            #stage .team strong{font-size:18px!important}
            #stage .team span{font-size:6px!important}
            #stage .centre{min-width:54px!important;padding:3px 4px!important}
            #stage .centre b{font-size:12px!important}
            #stage .centre span{font-size:8px!important}
            #stage .latest{left:7px!important;bottom:58px!important}
            #playfootyStageFullscreen{right:7px;bottom:7px;width:36px;height:36px}
            body.pf-stage-fullscreen #playfootyStageFullscreen{right:max(7px,env(safe-area-inset-right));bottom:max(7px,env(safe-area-inset-bottom))}
          }
        `
        doc.head.appendChild(style)
      }

      const mark=doc.createElement('div')
      mark.id='playfootyBroadcastWatermark'
      mark.setAttribute('aria-label','PlayFooty Live')
      mark.innerHTML='<img class="pf-broadcast-logo" src="/Playfooty-logo-modern.png" alt="PlayFooty"><span class="pf-broadcast-live"><i class="pf-broadcast-dot" aria-hidden="true"></i>Live</span>'
      stage.appendChild(mark)

      let button=doc.getElementById('playfootyStageFullscreen')
      if(!button){
        button=doc.createElement('button')
        button.id='playfootyStageFullscreen'
        button.type='button'
        button.setAttribute('aria-label','Enter fullscreen')
        button.setAttribute('aria-pressed','false')
        button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>'
        button.addEventListener('click',event=>{
          event.preventDefault()
          event.stopPropagation()
          toggleStageFullscreen(doc,stage)
        })
        stage.appendChild(button)
      }

      if(!doc.__playfootyFullscreenBound){
        doc.__playfootyFullscreenBound=true
        doc.addEventListener('fullscreenchange',()=>setStageFullscreen(doc,Boolean(doc.fullscreenElement)))
      }
      return true
    }

    function beginInstall(){
      clearInterval(installTimer)
      if(install())return
      installTimer=setInterval(()=>{
        if(install())clearInterval(installTimer)
      },250)
      setTimeout(()=>clearInterval(installTimer),15000)
    }

    studio.addEventListener('load',beginInstall)
    window.addEventListener('pageshow',beginInstall)
    window.addEventListener('beforeunload',()=>clearInterval(installTimer))
  })()
  </script>
</body>
</html>
