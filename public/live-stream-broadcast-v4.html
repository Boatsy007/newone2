<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#05090d" />
  <title>PlayFooty Live Broadcast Studio</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090d}iframe{position:fixed;inset:0;display:block;width:100%;height:100%;border:0;background:#05090d}
    .watch-live{position:fixed;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));z-index:2147483647;display:none;align-items:center;gap:7px;padding:10px 14px;border:1px solid rgba(255,255,255,.24);border-radius:999px;background:rgba(4,10,16,.92);color:#fff;text-decoration:none;font:900 11px/1 Inter,Arial,sans-serif;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter:blur(12px)}
    .watch-live.show{display:flex}.watch-live i{width:8px;height:8px;border-radius:50%;background:#ef3348;box-shadow:0 0 0 5px rgba(239,51,72,.16)}
    @media(max-width:620px){.watch-live{right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));padding:9px 11px;font-size:10px}}
  </style>
  <script src="https://web-broadcast.live-video.net/1.37.0/amazon-ivs-web-broadcast.js"></script>
</head>
<body>
  <iframe id="studio" title="PlayFooty Live Broadcast Studio" allow="camera; microphone; fullscreen; autoplay"></iframe>
  <a class="watch-live" id="watchLive" target="_blank" rel="noopener"><i aria-hidden="true"></i>Watch Live</a>
<script>
(() => {
  const SESSION_KEY='playfooty.clubPortal.session.v1'
  const studio=document.getElementById('studio')
  const watchLive=document.getElementById('watchLive')
  const clubId=new URLSearchParams(location.search).get('clubId')||''
  studio.src='/live-stream-broadcast-v3.html'+(location.search||'')
  if(clubId)watchLive.href='/live-room.html?clubId='+encodeURIComponent(clubId)
  let installTimer=0,visibilityTimer=0,heartbeatTimer=0,ivsClient=null,endingBroadcast=false

  function token(){try{const raw=localStorage.getItem(SESSION_KEY);const value=raw?JSON.parse(raw):null;return typeof value?.access_token==='string'?value.access_token:''}catch{return''}}
  function headers(){return{authorization:'Bearer '+token(),'content-type':'application/json'}}
  function v3Document(){try{return studio.contentDocument||null}catch{return null}}
  function deepestStudio(){try{const v3=v3Document(),v2=v3?.getElementById('interchange')?.contentDocument,broadcast=v2?.getElementById('broadcast')?.contentDocument;return broadcast?.getElementById('studio')?.contentDocument||null}catch{return null}}
  function cameraStream(){const stream=deepestStudio()?.getElementById('video')?.srcObject;return stream&&typeof stream.getTracks==='function'?stream:null}
  function notify(message){const v3=v3Document(),toast=v3?.getElementById('toast');if(!toast)return;toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3200)}
  async function api(path,options={}){const response=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'Live stream request failed');return payload}
  async function heartbeat(){if(!clubId||!ivsClient)return;try{await api('/api/live-stream/clubs/'+encodeURIComponent(clubId)+'/heartbeat',{method:'POST',body:'{}'})}catch{}}

  async function beginIvs(ingestEndpoint,streamKey,stream){
    const sdk=window.IVSBroadcastClient
    if(!sdk?.create)throw new Error('Amazon IVS broadcasting could not load on this device')
    const client=sdk.create({streamConfig:sdk.BASIC_LANDSCAPE,ingestEndpoint})
    const videoTracks=stream.getVideoTracks().filter(track=>track.readyState==='live')
    const audioTracks=stream.getAudioTracks().filter(track=>track.readyState==='live')
    if(!videoTracks.length)throw new Error('No live camera track is available')
    client.addVideoInputDevice(new MediaStream(videoTracks),'playfooty-camera',{index:0})
    if(audioTracks.length)client.addAudioInputDevice(new MediaStream(audioTracks),'playfooty-microphone')
    await client.startBroadcast(streamKey)
    return client
  }
  async function endIvs(){
    clearInterval(heartbeatTimer);heartbeatTimer=0
    if(ivsClient){try{await ivsClient.stopBroadcast()}catch{}try{ivsClient.delete?.()}catch{}}
    ivsClient=null
    watchLive.classList.remove('show')
  }
  async function endBroadcast({notifyOperator=true}={}){
    if(endingBroadcast)return
    endingBroadcast=true
    try{
      await endIvs()
      if(clubId)await api('/api/live-stream/clubs/'+encodeURIComponent(clubId)+'/stop',{method:'POST',body:'{}'})
      if(notifyOperator)notify('Broadcast ended.')
    }catch(error){
      if(notifyOperator)notify(error instanceof Error?error.message:'Unable to end the broadcast')
    }finally{endingBroadcast=false}
  }

  function setOperatorFullscreen(doc,active){
    doc.body.classList.toggle('stage-fullscreen',active);doc.documentElement.classList.toggle('stage-fullscreen-root',active)
    const button=doc.getElementById('stageFullscreenBtn');if(!button)return
    button.setAttribute('aria-pressed',String(active));button.setAttribute('aria-label',active?'Exit fullscreen':'Enter fullscreen')
    button.innerHTML=active?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>'
  }
  function syncControlVisibility(){
    const v3=v3Document(),doc=deepestStudio(),original=v3?.querySelector('.highlight-controls');if(!original||!doc)return false
    const fullscreen=doc.body.classList.contains('stage-fullscreen')
    original.style.setProperty('display',fullscreen?'none':'flex','important')
    watchLive.style.setProperty('display',fullscreen?'none':(ivsClient?'flex':'none'),'important')
    const start=doc.getElementById('operatorStartRecording');if(start){const stream=cameraStream(),cameraLive=Boolean(stream?.getTracks().some(track=>track.readyState==='live')),recording=doc.body.classList.contains('operator-recording');start.style.setProperty('display',cameraLive&&!recording?'grid':'none','important')}
    return true
  }
  function installOperatorFullscreen(){
    const doc=deepestStudio(),button=doc?.getElementById('stageFullscreenBtn');if(!doc||!button)return false
    if(button.dataset.operatorFullscreenBound!=='1'){button.dataset.operatorFullscreenBound='1';button.addEventListener('click',event=>{event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();const active=doc.body.classList.contains('stage-fullscreen');setOperatorFullscreen(doc,!active);requestAnimationFrame(syncControlVisibility);try{if(!active)screen.orientation?.lock?.('landscape').catch(()=>{});else screen.orientation?.unlock?.()}catch{}},true)}
    return true
  }
  function installStreamingControls(){
    const doc=deepestStudio(),start=doc?.getElementById('operatorStartRecording'),end=doc?.getElementById('operatorEndRecording'),stopCamera=doc?.getElementById('stopBtn');if(!doc||!start||!end||!stopCamera)return false
    if(start.dataset.stage2Bound!=='1'){
      start.dataset.stage2Bound='1'
      start.addEventListener('click',async event=>{
        if(start.dataset.stage2Bypass==='1'){start.dataset.stage2Bypass='0';return}
        event.preventDefault();event.stopPropagation();event.stopImmediatePropagation()
        const stream=cameraStream(),live=stream?.getTracks().some(track=>track.readyState==='live')
        if(!clubId||!live)return notify('Start the camera before starting the broadcast.')
        start.disabled=true;start.textContent='Connecting…'
        try{
          const payload=await api('/api/live-stream/clubs/'+encodeURIComponent(clubId)+'/start',{method:'POST',body:'{}'})
          const ingestEndpoint=payload?.data?.ingestEndpoint,streamKey=payload?.data?.streamKey
          if(!ingestEndpoint||!streamKey)throw new Error('Amazon IVS did not return the club broadcast credentials')
          ivsClient=await beginIvs(ingestEndpoint,streamKey,stream)
          heartbeatTimer=setInterval(heartbeat,5000);await heartbeat()
          watchLive.classList.add('show')
          start.dataset.stage2Bypass='1';start.disabled=false;start.textContent='Start Recording';start.click();notify('PlayFooty broadcast is live. Tap Watch Live to open the public room.')
        }catch(error){await endIvs();start.disabled=false;start.textContent='Start Recording';notify(error instanceof Error?error.message:'Unable to start the broadcast')}
      },true)
      end.addEventListener('click',async event=>{
        if(end.dataset.stage2Bypass==='1'){end.dataset.stage2Bypass='0';return}
        event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();end.disabled=true;end.textContent='Ending…'
        await endBroadcast()
        end.dataset.stage2Bypass='1';end.disabled=false;end.textContent='End Recording';end.click()
      },true)
      stopCamera.addEventListener('click',()=>{if(ivsClient)endBroadcast()},true)
    }
    return true
  }
  function beginInstall(){clearInterval(installTimer);clearInterval(visibilityTimer);const install=()=>installOperatorFullscreen()&&installStreamingControls();if(!install()){installTimer=setInterval(()=>{if(install())clearInterval(installTimer)},250);setTimeout(()=>clearInterval(installTimer),20000)}visibilityTimer=setInterval(syncControlVisibility,150);syncControlVisibility()}
  studio.addEventListener('load',beginInstall);window.addEventListener('pageshow',beginInstall)
  window.addEventListener('beforeunload',()=>{clearInterval(installTimer);clearInterval(visibilityTimer);clearInterval(heartbeatTimer);try{ivsClient?.stopBroadcast()}catch{}})
})()
</script>
</body>
</html>
