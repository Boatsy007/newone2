<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#05090d" />
  <title>PlayFooty Real-Time Camera</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090d;color:#fff;font-family:Inter,Arial,sans-serif}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#05090d}
    .record-start{display:none;position:fixed;left:50%;top:50%;z-index:2147483647;transform:translate(-50%,-50%);min-width:190px;min-height:58px;padding:14px 24px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:#d42d3b;color:#fff;font:1000 15px/1 Inter,Arial,sans-serif;text-transform:uppercase;box-shadow:0 12px 36px rgba(0,0,0,.62)}
    .record-start.show{display:grid;place-items:center}.record-start:disabled{opacity:.62}
    .record-end{display:none;position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:2147483647;min-height:40px;padding:10px 14px;border:1px solid rgba(255,255,255,.34);border-radius:999px;background:rgba(4,10,16,.94);color:#fff;font:900 11px/1 Inter,Arial,sans-serif;text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.55)}
    .record-end.show{display:block}.record-end:disabled{opacity:.62}
  </style>
  <script src="https://web-broadcast.live-video.net/1.37.0/amazon-ivs-web-broadcast.js"></script>
</head>
<body>
  <iframe id="studio" allow="camera;microphone;fullscreen;autoplay" title="PlayFooty live studio"></iframe>
  <button class="record-start" id="recordStart" type="button">Start Recording</button>
  <button class="record-end" id="recordEnd" type="button">End Recording</button>
<script>
(() => {
  const SESSION_KEY='playfooty.clubPortal.session.v1'
  const params=new URLSearchParams(location.search)
  const clubId=params.get('clubId')||''
  const cameraId=(params.get('cameraId')||'main').replace(/[^a-zA-Z0-9_-]/g,'').slice(0,64)||'main'
  const label=(params.get('cameraLabel')||'Main Camera').slice(0,60)
  const studio=document.getElementById('studio')
  const recordStart=document.getElementById('recordStart')
  const recordEnd=document.getElementById('recordEnd')
  studio.src='/live-stream-broadcast-v3.html'+location.search
  let stage=null,heartbeatTimer=0,cameraTimer=0,connecting=false,ending=false

  function token(){try{const raw=localStorage.getItem(SESSION_KEY);const value=raw?JSON.parse(raw):null;return typeof value?.access_token==='string'?value.access_token:''}catch{return''}}
  function headers(){return{authorization:'Bearer '+token(),'content-type':'application/json'}}
  function documents(){
    const out=[]
    try{
      const d3=studio.contentDocument;if(d3)out.push(d3)
      const d2=d3?.getElementById('interchange')?.contentDocument;if(d2)out.push(d2)
      const db=d2?.getElementById('broadcast')?.contentDocument;if(db)out.push(db)
      const ds=db?.getElementById('studio')?.contentDocument;if(ds)out.push(ds)
    }catch{}
    return out
  }
  function cameraDocument(){const all=documents();return all[all.length-1]||null}
  function cameraStream(){const value=cameraDocument()?.getElementById('video')?.srcObject;return value&&typeof value.getTracks==='function'?value:null}
  function cameraIsLive(){return Boolean(cameraStream()?.getVideoTracks().some(track=>track.readyState==='live'))}
  function notify(message){try{const toast=studio.contentDocument?.getElementById('toast');if(toast){toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3500);return}}catch{}alert(message)}
  async function api(path,options={}){const response=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'Real-time request failed');return payload}
  async function heartbeat(){if(!stage||!clubId)return;try{await api('/api/live-stream/realtime/clubs/'+encodeURIComponent(clubId)+'/heartbeat',{method:'POST',body:'{}'})}catch{}}

  function hideNonCameraUi(){
    documents().forEach(doc=>{
      if(!doc?.head)return
      let style=doc.getElementById('pf-camera-safe-clean-style')
      if(!style){
        style=doc.createElement('style')
        style.id='pf-camera-safe-clean-style'
        style.textContent='.highlight-controls,.clips-button,.highlight-button,.drawer,.latest,.top-bug,.pf-director-overlay,.pf-goal-replay,.pf-rt-event,.pf-rt-replay,.pf-presented-by,.pf-presented,.pf-sponsor-break,.pf-sponsor-break-overlay,.goal-animation,.goal-overlay,.behind-overlay,.interchange-overlay,.event-overlay,.event-banner,.score-event,.score-animation,.player-announcement,.goal-announcement,.interchange-announcement,.replay-overlay,.replay-player,[data-viewer-only="true"],#fullscreenOperatorHighlights,#operatorStartRecording,#operatorEndRecording{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important}'
        doc.head.appendChild(style)
      }
    })
  }

  async function joinStage(media){
    const sdk=window.IVSBroadcastClient
    if(!sdk?.Stage||!sdk?.LocalStageStream)throw new Error('Amazon IVS Real-Time SDK could not load')
    const payload=await api('/api/live-stream/realtime/clubs/'+encodeURIComponent(clubId)+'/publisher-token',{method:'POST',body:JSON.stringify({cameraId,label})})
    const participantToken=payload?.data?.token
    if(!participantToken)throw new Error('No Real-Time participant token was returned')
    const videoTrack=media.getVideoTracks().find(track=>track.readyState==='live')
    const audioTrack=media.getAudioTracks().find(track=>track.readyState==='live')
    if(!videoTrack)throw new Error('No live camera track is available')
    const tracks=[new sdk.LocalStageStream(videoTrack,{maxBitrate:1800,maxFramerate:30,simulcast:{enabled:true}})]
    if(audioTrack)tracks.push(new sdk.LocalStageStream(audioTrack))
    const strategy={stageStreamsToPublish:()=>tracks,shouldPublishParticipant:()=>true,shouldSubscribeToParticipant:()=>sdk.SubscribeType.NONE}
    const next=new sdk.Stage(participantToken,strategy)
    await next.join()
    return next
  }
  function renderControls(){const ready=cameraIsLive();recordStart.classList.toggle('show',ready&&!stage&&!connecting);recordEnd.classList.toggle('show',Boolean(stage))}
  async function leaveStage(){clearInterval(heartbeatTimer);heartbeatTimer=0;if(stage){try{stage.leave()}catch{}stage=null}renderControls()}
  async function startBroadcast(){
    if(connecting||stage)return
    const media=cameraStream()
    if(!clubId||!media?.getVideoTracks().some(track=>track.readyState==='live'))return notify('Start the camera before going live.')
    connecting=true;recordStart.disabled=true;recordStart.textContent='Connecting…';renderControls()
    try{stage=await joinStage(media);await heartbeat();heartbeatTimer=setInterval(heartbeat,5000);notify('PlayFooty Real-Time is live.')}catch(error){await leaveStage();notify(error instanceof Error?error.message:'Unable to start Real-Time broadcast')}finally{connecting=false;recordStart.disabled=false;recordStart.textContent='Start Recording';renderControls()}
  async function stopBroadcast(){
    if(ending)return
    ending=true;recordEnd.disabled=true;recordEnd.textContent='Ending…'
    try{await leaveStage();if(clubId)await api('/api/live-stream/realtime/clubs/'+encodeURIComponent(clubId)+'/stop',{method:'POST',body:'{}'});notify('Real-time broadcast ended.')}catch(error){notify(error instanceof Error?error.message:'Unable to end broadcast')}finally{ending=false;recordEnd.disabled=false;recordEnd.textContent='End Recording';renderControls()}
  recordStart.addEventListener('click',startBroadcast)
  recordEnd.addEventListener('click',stopBroadcast)
  studio.addEventListener('load',()=>{hideNonCameraUi();renderControls()})
  window.addEventListener('pageshow',()=>{hideNonCameraUi();renderControls()})
  cameraTimer=setInterval(()=>{hideNonCameraUi();renderControls()},500)
  window.addEventListener('beforeunload',()=>{clearInterval(cameraTimer);clearInterval(heartbeatTimer);try{stage?.leave()}catch{}})
})()
</script>
</body>
</html>
