<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#061019">
<title>PlayFooty Multi-Camera Producer</title>
<script src="https://player.live-video.net/1.54.0/amazon-ivs-player.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#05090d;color:#fff;font-family:Inter,Arial,sans-serif}button,input{font:inherit}.shell{width:min(1240px,calc(100% - 24px));margin:auto;padding:18px 0 42px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:16px}.brand{font-size:23px;font-weight:1000;font-style:italic}.brand b{color:#42b8ff}.status{font-size:10px;font-weight:900;text-transform:uppercase;color:#9db0bc}.panel{border:1px solid #29404f;border-radius:16px;background:#0c1822;padding:16px;margin-bottom:16px}.panel h1,.panel h2{margin:0;font-family:Impact,'Arial Narrow Bold',sans-serif;text-transform:uppercase}.panel h1{font-size:42px}.panel h2{font-size:27px}.panel p{color:#91a5b2}.add{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-top:14px}.add input{min-width:0;border:1px solid #345062;border-radius:10px;background:#07121a;color:#fff;padding:11px}.add button,.take,.copy{border:0;border-radius:10px;background:#42b8ff;color:#02131e;padding:11px 14px;font-weight:1000;text-transform:uppercase;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.camera{overflow:hidden;border:2px solid #263d4d;border-radius:14px;background:#07111a}.camera.program{border-color:#ef3348;box-shadow:0 0 0 4px rgba(239,51,72,.14)}.preview{position:relative;aspect-ratio:16/9;background:#000}.preview video{width:100%;height:100%;object-fit:contain;background:#000}.offline{position:absolute;inset:0;display:grid;place-items:center;color:#82939e;font-weight:900;text-transform:uppercase}.camera-head{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border-top:1px solid #263d4d}.camera-name strong,.camera-name small{display:block}.camera-name small{margin-top:3px;color:#90a2ad;font-size:9px;text-transform:uppercase}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#667985;margin-right:6px}.connected .dot{background:#43d48b;box-shadow:0 0 0 4px rgba(67,212,139,.14)}.program-tag{display:none;color:#ff6978;font-size:9px;font-weight:1000;text-transform:uppercase}.program .program-tag{display:block}.actions{display:flex;gap:8px;align-items:center}.take:disabled{opacity:.4;cursor:not-allowed}.empty{padding:40px;text-align:center;color:#91a5b2;border:1px dashed #395264;border-radius:14px}.linkbox{display:none;margin-top:12px;padding:12px;border-radius:10px;background:#061019;border:1px solid #29404f}.linkbox.show{display:block}.linkbox code{display:block;overflow-wrap:anywhere;color:#b9dff5;font-size:11px;margin-bottom:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.add{grid-template-columns:1fr}.panel h1{font-size:34px}.shell{width:calc(100% - 12px);padding-top:8px}}
</style>
</head>
<body><main class="shell"><div class="top"><div class="brand"><b>PLAY</b>FOOTY PRO</div><div class="status" id="status">Loading studio…</div></div>
<section class="panel"><h1>Multi-Camera Producer</h1><p>Connect additional phones, preview every angle and choose which camera viewers see.</p><div class="add"><input id="cameraLabel" placeholder="Camera label, e.g. Boundary"><input id="cameraId" placeholder="Camera ID" maxlength="64"><button id="createLink">Create camera link</button></div><div class="linkbox" id="linkbox"><code id="cameraLink"></code><button class="copy" id="copyLink">Copy link</button></div></section>
<section class="panel"><h2>Camera Sources</h2><div class="grid" id="grid"></div></section></main>
<script>
(()=>{
const SESSION_KEY='playfooty.clubPortal.session.v1',clubId=new URLSearchParams(location.search).get('clubId')||'',grid=document.getElementById('grid'),players=new Map();let pollTimer=0
const token=()=>{try{const raw=localStorage.getItem(SESSION_KEY),v=raw?JSON.parse(raw):null;return typeof v?.access_token==='string'?v.access_token:''}catch{return''}}
const headers=()=>({authorization:'Bearer '+token(),'content-type':'application/json'})
async function api(path,options={}){const r=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}}),p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||'Multi-camera request failed');return p}
function safe(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function destroyMissing(ids){for(const [id,p] of players){if(ids.has(id))continue;try{p.delete()}catch{}players.delete(id)}}
function attach(id,video,url){if(!url||players.has(id)||!window.IVSPlayer?.isPlayerSupported)return;const p=window.IVSPlayer.create();p.attachHTMLVideoElement(video);p.load(url);p.setMuted(true);p.play().catch(()=>{});players.set(id,p)}
function render(cameras){const ids=new Set(cameras.map(c=>c.cameraId));destroyMissing(ids);grid.innerHTML='';if(!cameras.length){grid.innerHTML='<div class="empty">No extra cameras have joined yet.</div>';return}
cameras.forEach(c=>{const card=document.createElement('article');card.className='camera '+(c.connected?'connected ':'')+(c.isProgram?'program':'');card.innerHTML='<div class="preview"><video playsinline autoplay muted></video><div class="offline">'+(c.connected?'Connecting preview…':'Camera offline')+'</div></div><div class="camera-head"><div class="camera-name"><strong>'+safe(c.label)+'</strong><small><span class="dot"></span>'+(c.connected?'Connected':'Offline')+'</small><span class="program-tag">On air</span></div><div class="actions"><button class="take" '+(!c.connected||c.isProgram?'disabled':'')+'>Take live</button></div></div>';grid.appendChild(card);const video=card.querySelector('video'),offline=card.querySelector('.offline');video.addEventListener('playing',()=>offline.style.display='none');if(c.connected)attach(c.cameraId,video,c.playbackUrl);card.querySelector('.take').addEventListener('click',()=>takeLive(c.cameraId))})}
async function load(){if(!clubId||!token()){document.getElementById('status').textContent='Club login required';return}try{const p=await api('/api/live-stream/multi-camera/clubs/'+encodeURIComponent(clubId)+'/cameras?t='+Date.now(),{cache:'no-store'});render(Array.isArray(p.data)?p.data:[]);document.getElementById('status').textContent=(p.data||[]).filter(c=>c.connected).length+' cameras connected'}catch(e){document.getElementById('status').textContent=e.message}}
async function takeLive(cameraId){try{document.getElementById('status').textContent='Switching camera…';await api('/api/live-stream/multi-camera/clubs/'+encodeURIComponent(clubId)+'/program/take',{method:'POST',body:JSON.stringify({cameraId})});await load()}catch(e){document.getElementById('status').textContent=e.message}}
document.getElementById('createLink').addEventListener('click',()=>{const label=(document.getElementById('cameraLabel').value||'Camera').trim().slice(0,60),raw=(document.getElementById('cameraId').value||label.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Math.random().toString(36).slice(2,6)),id=raw.replace(/[^a-zA-Z0-9_-]/g,'').slice(0,64);const url=new URL('/live-stream-broadcast-v4.html',location.origin);url.searchParams.set('clubId',clubId);url.searchParams.set('multiCamera','1');url.searchParams.set('cameraId',id);url.searchParams.set('cameraLabel',label);document.getElementById('cameraLink').textContent=url.href;document.getElementById('linkbox').classList.add('show')})
document.getElementById('copyLink').addEventListener('click',async()=>{await navigator.clipboard.writeText(document.getElementById('cameraLink').textContent);document.getElementById('copyLink').textContent='Copied';setTimeout(()=>document.getElementById('copyLink').textContent='Copy link',1500)})
load();pollTimer=setInterval(load,3000);window.addEventListener('beforeunload',()=>{clearInterval(pollTimer);players.forEach(p=>{try{p.delete()}catch{}})})
})()
</script></body></html>
