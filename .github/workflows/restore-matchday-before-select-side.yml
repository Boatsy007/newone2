name: Restore Match Day before Select Side experiment
on:
  push:
    paths:
      - '.github/workflows/restore-matchday-before-select-side.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Restore last working Match Day
        run: |
          git show 7d37ae6306b4e19693ab7e5bccf18701e119850b:src/pages/CoachAppMatchDay.tsx > src/pages/CoachAppMatchDay.tsx
          rm -f .github/workflows/align-matchday-field-select-side.yml
          rm -f .github/workflows/match-matchday-field-wrapper.yml
          rm -f .github/scripts/apply_matchday_wrapper.py
          rm -f .github/workflows/restore-matchday-before-select-side.yml
      - name: Commit restoration
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add -A
          git commit -m 'Restore Match Day before Select Side layout experiment'
          git push origin newone1
