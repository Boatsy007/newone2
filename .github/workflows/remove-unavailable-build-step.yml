name: Remove unavailable patch build step

on:
  push:
    paths:
      - '.github/workflows/remove-unavailable-build-step.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Remove unavailable workflow build step
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/apply-unavailable-select-team.yml')
          text=path.read_text()
          text=text.replace("      - name: Verify build\n        run: npm run build\n","")
          path.write_text(text)
          PY
      - name: Commit workflow fix
        run: |
          git config user.name "PlayFooty Automation"
          git config user.email "actions@playfooty.com.au"
          git add .github/workflows/apply-unavailable-select-team.yml
          git commit -m "Allow unavailable player patch to commit"
          git push origin HEAD:newone1
