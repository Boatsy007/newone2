name: Native Match Day interchange hotfix

on:
  push:
    branches:
      - native-ipad-app

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Match Day interchange highlights'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-ipad-app
          fetch-depth: 0
      - name: Patch Match Day interchange highlighting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/ipad/src/screens/MatchDayScreen.tsx')
          s = p.read_text()
          old_style = "style={[styles.playerCard,bench&&styles.benchPlayerCard,rotation.includes(slot.positionCode)&&styles.playerRotation,bench&&tone,slot.injured&&styles.playerInjured,selected===slot.clubPlayerId&&styles.playerSelected]}"
          new_style = "style={[styles.playerCard,bench&&styles.benchPlayerCard,bench&&tone,slot.injured&&styles.playerInjured,rotation.includes(slot.positionCode)&&styles.playerRotation,selected===slot.clubPlayerId&&styles.playerSelected]}"
          if old_style not in s:
              raise SystemExit('PlayerCard style target not found')
          s = s.replace(old_style, new_style, 1)
          old_tail = "</View></Pressable>}\nfunction FeedPanel"
          new_tail = "</View>{slot.injured?<View pointerEvents=\"none\" style={styles.injuredOverlay}><Text style={styles.injuredOverlayText}>INJURED</Text></View>:null}</Pressable>}\nfunction FeedPanel"
          if old_tail not in s:
              raise SystemExit('PlayerCard tail target not found')
          s = s.replace(old_tail, new_tail, 1)
          old_injured = "playerInjured:{opacity:.62,backgroundColor:'#FFE3E6'}"
          new_injured = "playerInjured:{borderColor:'#D7263D'},injuredOverlay:{position:'absolute',left:0,right:0,top:0,bottom:0,backgroundColor:'rgba(215,38,61,.76)',alignItems:'center',justifyContent:'center',zIndex:20},injuredOverlayText:{fontSize:12,fontWeight:'900',letterSpacing:1.2,color:'#fff'}"
          if old_injured not in s:
              raise SystemExit('Injury style target not found')
          s = s.replace(old_injured, new_injured, 1)
          p.write_text(s)
          PY
      - name: Commit native Match Day fix
        shell: bash
        run: |
          git config user.name "PlayFooty Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/ipad/src/screens/MatchDayScreen.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Apply Match Day interchange highlights"
          git push origin HEAD:native-ipad-app
