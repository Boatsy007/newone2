name: Fix Coach App Empty Team Sheet Fallback
on:
  push:
    branches: [newone1]
    paths:
      - '.github/workflows/fix-coach-app-empty-sheet-fallback.yml'
      - '.github/scripts/fix_coach_app_empty_sheet_fallback.py'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - run: python .github/scripts/fix_coach_app_empty_sheet_fallback.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/api/routes/coach-app.ts
          git diff --cached --quiet && exit 0
          git commit -m "Allow empty Coach App team sheet fallback"
          git pull --rebase origin newone1
          git push origin HEAD:newone1
