name: Validate Membership Stage 3
on:
  push:
    paths:
      - .github/workflows/validate-membership-stage3.yml
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix backend ci --ignore-scripts
      - name: QR generation smoke test
        run: node --input-type=module -e "import QRCode from 'qrcode'; const qr=QRCode.create('pfm_stage3_validation'); if(!qr?.modules?.size || qr.modules.size < 21) process.exit(1); console.log('QR modules', qr.modules.size)"
      - name: Frontend typecheck
        run: npx tsc -b
      - name: Backend typecheck
        run: npm --prefix backend exec tsc -- --noEmit
      - name: Full production build
        run: npm run build
