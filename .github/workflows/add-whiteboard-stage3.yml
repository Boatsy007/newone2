name: Add Whiteboard Stage 3
on:
  push:
    branches: [newone1]
    paths:
      - scripts/add_whiteboard_stage3.py
      - backend/src/api/routes/whiteboard-analysis.ts
      - backend/api/index.ts
      - .github/workflows/add-whiteboard-stage3.yml
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Apply Stage 3 UI
        run: python scripts/add_whiteboard_stage3.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build production app
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CoachAppWhiteboardStage2.tsx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add AI tactical assistant to whiteboard"
          git push origin HEAD:newone1
