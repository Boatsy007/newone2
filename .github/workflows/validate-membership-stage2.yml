name: Validate Membership Stage 2
on:
  push:
    branches: [newone1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm --prefix backend ci --ignore-scripts
      - name: Frontend typecheck
        run: npx tsc -b
      - name: Backend typecheck
        run: npm --prefix backend exec tsc -- --noEmit
      - name: Production frontend build
        run: npx vite build
