name: Fix Whiteboard Midfield Filter Aliases
on:
  push:
    branches: [newone1]
    paths:
      - '.github/scripts/fix_whiteboard_midfield_filter_aliases.py'
      - '.github/workflows/fix-whiteboard-midfield-filter-aliases.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Apply midfield filter alias fix
        run: python .github/scripts/fix_whiteboard_midfield_filter_aliases.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Build production app
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CoachAppWhiteboardStage2.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Fix Whiteboard midfield player filter'
            git push origin newone1
          fi
