name: Fix Admin Team Sheet Canonical Mapping
on:
  push:
    branches: [newone1]
    paths:
      - '.github/workflows/fix-admin-team-sheet-canonical-mapping.yml'
      - '.github/scripts/fix_admin_team_sheet_canonical_mapping.py'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - run: python .github/scripts/fix_admin_team_sheet_canonical_mapping.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore backend/prisma/schema.prisma || true
          git add backend/src/api/routes/team-sheets.ts src/pages/AdminTeamSheets.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix Admin team sheet canonical mapping"
          git pull --rebase --autostash origin newone1
          git push origin HEAD:newone1
