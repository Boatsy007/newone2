name: Connect Whiteboard Real Opposition
on:
  push:
    branches: [newone1]
    paths:
      - '.github/scripts/connect_whiteboard_real_opposition.py'
      - '.github/workflows/connect-whiteboard-real-opposition.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Apply real opposition connection
        run: python .github/scripts/connect_whiteboard_real_opposition.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Build production app
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/api/routes/club-team-sheets.ts src/pages/CoachAppWhiteboardStage2.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Connect Whiteboard to real opposition selected team"
          git push origin newone1
