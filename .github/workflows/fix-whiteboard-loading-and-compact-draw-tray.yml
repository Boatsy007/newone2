name: Fix Whiteboard Loading And Compact Draw Tray
on:
  push:
    branches: [newone1]
    paths:
      - '.github/scripts/fix_whiteboard_loading_and_compact_draw_tray.py'
      - '.github/workflows/fix-whiteboard-loading-and-compact-draw-tray.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Apply Whiteboard loading and compact draw tray fix
        run: python .github/scripts/fix_whiteboard_loading_and_compact_draw_tray.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Build production app
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CoachAppWhiteboardStage2.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Use Coach App loading screen and compact drawing tray'
            git push origin newone1
          fi
