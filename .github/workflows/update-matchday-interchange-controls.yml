name: Update Match Day Interchange Controls
on:
  push:
    branches: [newone1]
    paths:
      - scripts/update_matchday_interchange_controls.py
      - .github/workflows/update-matchday-interchange-controls.yml
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Apply Match Day interaction change
        run: python scripts/update_matchday_interchange_controls.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CoachAppMatchDay.tsx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refine Match Day interchange controls"
          git push origin HEAD:newone1
