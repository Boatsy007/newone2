name: Native remote sync one-off

on:
  push:
    branches:
      - native-ipad-app
    paths:
      - .github/workflows/native-remote-sync-once.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-ipad-app
          fetch-depth: 0
      - name: Patch Match Day remote sync safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/ipad/src/screens/MatchDayScreen.tsx')
          text = path.read_text()

          import_anchor = "import { loadClubConnections } from '../connections'\n"
          import_line = "import { loadRemoteMatchState } from '../liveMatchControl'\n"
          if import_line not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('MatchDay import anchor was not unique; refusing to edit')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          cleanup_anchor = " useEffect(()=>()=>{if(saveTimer.current)clearTimeout(saveTimer.current)},[])\n"
          effect_marker = "const remote=await loadRemoteMatchState(club.clubId,sheetId,token)"
          effect = """ useEffect(()=>{\n  if(!sheetId)return\n  let cancelled=false\n  const refresh=async()=>{\n   try{\n    const remote=await loadRemoteMatchState(club.clubId,sheetId,token)\n    if(cancelled||!remote)return\n    setState(current=>{\n     if(!current)return current\n     const remoteRunning=remote.runningSince==null?null:Number(remote.runningSince)\n     const merged=current.runningSince&&remoteRunning===null?accrue(current):current\n     return {...merged,quarter:Math.max(1,Math.min(4,Number(remote.quarter)||merged.quarter)),elapsed:Math.max(0,Number(remote.elapsed)||0),runningSince:remoteRunning,trackingUpdatedAt:remoteRunning?(Number(remote.trackingUpdatedAt)||remoteRunning):null,teamStats:{...EMPTY_STATS,...merged.teamStats,...(remote.teamStats??{})},kpiTargets:{...DEFAULT_TARGETS,...merged.kpiTargets,...(remote.kpiTargets??{})}}\n    })\n   }catch{}\n  }\n  void refresh()\n  const timer=setInterval(()=>void refresh(),650)\n  return()=>{cancelled=true;clearInterval(timer)}\n },[club.clubId,sheetId,token])\n"""
          if effect_marker not in text:
              if text.count(cleanup_anchor) != 1:
                  raise SystemExit('MatchDay cleanup anchor was not unique; refusing to edit')
              text = text.replace(cleanup_anchor, effect + cleanup_anchor, 1)

          path.write_text(text)

          operations = Path('apps/ipad/src/screens/OperationsScreen.tsx')
          operations_text = operations.read_text()
          operations_text = operations_text.replace("fontWeight:'850'", "fontWeight:'800'")
          operations.write_text(operations_text)
          PY
      - name: Install native app dependencies
        working-directory: apps/ipad
        run: npm ci
      - name: Typecheck native app
        working-directory: apps/ipad
        run: npm run typecheck
      - name: Commit verified patch and remove one-off workflow
        shell: bash
        run: |
          rm .github/workflows/native-remote-sync-once.yml
          git config user.name "PlayFooty Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/ipad/src/screens/MatchDayScreen.tsx apps/ipad/src/screens/OperationsScreen.tsx .github/workflows/native-remote-sync-once.yml
          git commit -m "Sync native Match Day with remote operations controls"
          git push origin HEAD:native-ipad-app
