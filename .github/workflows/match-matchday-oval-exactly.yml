name: Match Match Day oval to Select Side
on:
  push:
    branches: [newone1]
    paths: ['.github/workflows/match-matchday-oval-exactly.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - name: Apply exact Select Side field geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/pages/CoachAppMatchDay.tsx')
          s=p.read_text()
          old=".camd-oval{position:relative;isolation:isolate;display:grid;align-content:space-around;width:min(850px,94%);height:min(650px,calc(100vh - 270px));min-height:540px;margin:5px auto 0;padding:18px 36px;overflow:visible;border:3px solid #2cf18f;border-radius:50% / 46%;background:repeating-linear-gradient(90deg,#067b39 0 10%,#078b40 10% 20%);box-shadow:inset 0 0 30px rgba(0,0,0,.18),0 0 20px rgba(44,241,143,.14)}"
          new=".camd-oval{position:relative;isolation:isolate;display:grid;grid-template-rows:repeat(6,1fr);align-items:center;width:min(850px,100%);height:min(650px,calc(100vh - 255px));min-height:540px;margin:5px auto 0;padding:18px 36px;overflow:visible;border:3px solid #2cf18f;border-radius:50% / 46%;background:repeating-linear-gradient(90deg,#067b39 0 10%,#078b40 10% 20%);box-shadow:inset 0 0 30px rgba(0,0,0,.18),0 0 20px rgba(44,241,143,.14)}"
          if old not in s:
              raise SystemExit('base oval block not found')
          s=s.replace(old,new,1)
          s=s.replace(".camd-field-markings{position:absolute;z-index:-1;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}",".camd-field-markings{position:absolute;z-index:-1;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}",1)
          s=s.replace(".camd-row{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:center}.camd-row.edge-row{width:100%;margin-left:0}.camd-row:first-of-type .camd-player:nth-child(2){transform:translateY(-14px)}.camd-row:last-of-type .camd-player:nth-child(2){transform:translateY(14px)}", ".camd-row{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:center}.camd-row.edge-row{width:100%;margin-left:0}.camd-row:first-of-type .camd-player:nth-child(2){transform:translateY(-14px)}.camd-row:last-of-type .camd-player:nth-child(2){transform:translateY(14px)}",1)
          s=s.replace(".camd-oval{width:95%;min-height:600px;padding:14px 17px;border-radius:50% / 46%}",".camd-oval{width:min(850px,100%);height:min(650px,calc(100vh - 255px));min-height:600px;padding:14px 17px;border-radius:50% / 46%}",1)
          s=s.replace(".camd-oval{width:min(850px,94%);height:calc(100% - 101px);min-height:405px;max-height:540px;margin-top:2px;padding:12px 32px;border-radius:50% / 46%}",".camd-oval{width:min(850px,100%);height:calc(100vh - 205px);min-height:410px;max-height:540px;margin-top:2px;padding:12px 32px;border-radius:50% / 46%}",1)
          s=s.replace(".camd-row:first-of-type .camd-player:nth-child(2){transform:translateY(-9px)}.camd-row:last-of-type .camd-player:nth-child(2){transform:translateY(9px)}", ".camd-row:first-of-type .camd-player:nth-child(2){transform:translateY(-9px)}.camd-row:last-of-type .camd-player:nth-child(2){transform:translateY(9px)}",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachAppMatchDay.tsx
          git commit -m 'Match Match Day oval exactly to Select Side'
          git push origin newone1
