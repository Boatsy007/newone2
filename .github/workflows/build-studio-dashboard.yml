name: Build Studio Dashboard
on:
  push:
    branches: [newone1]
    paths:
      - '.github/workflows/build-studio-dashboard.yml'
      - '.github/scripts/build_studio_dashboard.py'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - run: python .github/scripts/build_studio_dashboard.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run build
      - name: Commit Studio dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- backend/prisma/schema.prisma || true
          git add src/pages/ClubPortalMedia.tsx src/main.tsx src/components/club/ClubPortalAppNav.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Create Club Studio dashboard"
          git push origin HEAD:newone1
