name: Connect Coach App Whiteboard
on:
  push:
    branches: [newone1]
    paths:
      - scripts/connect_coach_app_whiteboard.py
      - .github/workflows/connect-coach-app-whiteboard.yml
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Connect whiteboard
        run: python scripts/connect_coach_app_whiteboard.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build frontend
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CoachApp.tsx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Connect native Coach App whiteboard"
          git push origin HEAD:newone1
