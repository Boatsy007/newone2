name: Public search overlay state

on:
  push:
    paths:
      - '.github/workflows/public-search-overlay-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish search state
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/components/rankings/GlobalSearch.tsx')
          text=path.read_text()
          needle="  useEffect(() => {\n    if (!isOpen) return\n    const previous = document.body.style.overflow"
          replacement="  useEffect(() => {\n    document.body.classList.toggle('pf-search-open', isOpen)\n    if (!isOpen) return () => { document.body.classList.remove('pf-search-open') }\n    const previous = document.body.style.overflow"
          assert needle in text
          text=text.replace(needle,replacement,1)
          old="return () => { document.body.style.overflow = previous }\n  }, [isOpen])"
          new="return () => { document.body.style.overflow = previous; document.body.classList.remove('pf-search-open') }\n  }, [isOpen])"
          assert old in text
          text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name "PlayFooty Automation"
          git config user.email "actions@playfooty.com.au"
          git add src/components/rankings/GlobalSearch.tsx
          git commit -m "Hide public app navigation during search"
          git push origin HEAD:newone1
