name: Polish Whiteboard Priority 5
on:
  push:
    paths:
      - '.github/workflows/polish-whiteboard-priority5.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - name: Apply final polish
        run: python3 scripts/polish_whiteboard_priority5.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build production app
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CoachAppWhiteboardStage2.tsx
          git commit -m "Complete whiteboard UI polish" || exit 0
          git push origin HEAD:newone1
