name: Apply Club Page Permissions
on:
  push:
    branches: [newone1]
    paths:
      - scripts/apply-club-page-permissions.py
      - .github/workflows/apply-club-page-permissions.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply permissions system
        run: python scripts/apply-club-page-permissions.py
      - name: Fix generated screen narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/CoachApp.tsx')
          text = path.read_text()
          text = text.replace("screen!=='DASHBOARD'&&screen!=='CLUB_DASHBOARD'&&screen!=='PERMISSIONS'?", "screen!=='DASHBOARD'&&screen!=='CLUB_DASHBOARD'?")
          path.write_text(text)
          PY
      - name: Install frontend
        run: npm ci
      - name: Install backend
        working-directory: backend
        run: npm ci
      - name: Check frontend
        run: npm run build
      - name: Check permission backend modules
        working-directory: backend
        run: timeout 40s npx tsx -e "Promise.all([import('./src/auth/club-permissions.ts'),import('./src/auth/club-auth.ts'),import('./src/api/routes/club-permissions.ts'),import('./src/api/routes/coach-app.ts')]).then(()=>{console.log('Permission backend modules loaded');process.exit(0)}).catch(error=>{console.error(error);process.exit(1)})"
      - name: Commit
        run: |
          git config user.name "PlayFooty Builder"
          git config user.email "builder@playfooty.com.au"
          git add backend/src/auth/club-auth.ts backend/src/api/routes/club-portal-access.ts backend/src/api/routes/coach-app.ts src/components/CoachAppClubDashboard.tsx src/pages/CoachApp.tsx src/pages/CoachAppPermissions.tsx
          git commit -m "Add page-level club permissions" || exit 0
          git push origin newone1
