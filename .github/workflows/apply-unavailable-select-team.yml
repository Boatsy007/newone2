name: Apply unavailable Select Team cards

on:
  push:
    paths:
      - '.github/workflows/apply-unavailable-select-team.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Apply patch
        run: |
          cat > /tmp/patch.py <<'PY'
          from pathlib import Path

          backend = Path('backend/src/api/routes/club-team-sheets.ts')
          text = backend.read_text()
          old = '''router.get('/clubs/:clubId/players', async (req,res) => {
            try { await ensureTables(); const rows=await prisma.$queryRawUnsafe(`SELECT id::text AS id,player_id AS "playerId",player_name AS "playerName",jumper_number AS "jumperNumber",preferred_position AS "preferredPosition",active FROM football_club_players WHERE club_id=$1 ORDER BY active DESC,player_name`,req.params.clubId); res.json({data:rows,positions:POSITIONS}) }
            catch(error){res.status(500).json({error:'failed to load club players',detail:String(error)})}
          })'''.replace('          ','')
          new = '''router.get('/clubs/:clubId/players', async (req,res) => {
            try {
              await ensureTables(); await ensureAvailabilityTables()
              const sheetId=String(req.query.sheetId??'').trim()
              if(sheetId){const sheet=await sheetForClub(sheetId,req.params.clubId);if(!sheet)return res.status(404).json({error:'Team sheet not found for this club'})}
              const rows=await prisma.$queryRawUnsafe(`SELECT cp.id::text AS id,cp.player_id AS "playerId",cp.player_name AS "playerName",cp.jumper_number AS "jumperNumber",cp.preferred_position AS "preferredPosition",cp.active,a.status AS "availabilityStatus",a.reason AS "availabilityReason" FROM football_club_players cp LEFT JOIN football_player_availability a ON a.club_player_id=cp.id AND a.team_sheet_id::text=$2 WHERE cp.club_id=$1 ORDER BY cp.active DESC,cp.player_name`,req.params.clubId,sheetId)
              res.json({data:rows,positions:POSITIONS})
            }
            catch(error){res.status(500).json({error:'failed to load club players',detail:String(error)})}
          })'''.replace('          ','')
          if old not in text:
              raise SystemExit('Expected club players route was not found')
          backend.write_text(text.replace(old,new,1))

          frontend = Path('src/pages/CoachAppSelectSide.tsx')
          text = frontend.read_text()
          simple = [
            ("type Player = { id:string; playerName:string; jumperNumber:number|null; active:boolean }", "type Player = { id:string; playerName:string; jumperNumber:number|null; active:boolean; availabilityStatus:string|null; availabilityReason:string|null }"),
            ("/players`,{headers})", "/players?sheetId=${encodeURIComponent(sheetId)}`,{headers})"),
            ("  function player(id:string){return players.find(item=>item.id===id)}\n", "  function player(id:string){return players.find(item=>item.id===id)}\n  function isUnavailable(item:Player|undefined){return item?.availabilityStatus==='UNAVAILABLE'}\n"),
            ("          const position=positionByPlayer.get(item.id)\n          return <button", "          const position=positionByPlayer.get(item.id)\n          const unavailable=isUnavailable(item)\n          return <button"),
            ("${position?'selected':''}`}", "${position?'selected':''} ${unavailable?'unavailable':''}`} title={unavailable&&item.availabilityReason?item.availabilityReason:undefined}"),
            ("<small>{position?LABELS[position]:'Not selected'}</small>", "<small>{unavailable?'Unavailable':position?LABELS[position]:'Not selected'}</small>"),
            ("function PositionCard({code,player,active,onClick,onDrop}:{code:string;player:Player|undefined;active:boolean;onClick:()=>void;onDrop:(event:React.DragEvent)=>void}){\n  return", "function PositionCard({code,player,active,onClick,onDrop}:{code:string;player:Player|undefined;active:boolean;onClick:()=>void;onDrop:(event:React.DragEvent)=>void}){\n  const unavailable=player?.availabilityStatus==='UNAVAILABLE'\n  return"),
            ("${player?'filled':'empty'}`}", "${player?'filled':'empty'} ${unavailable?'unavailable':''}`} title={unavailable&&player?.availabilityReason?player.availabilityReason:undefined}"),
            ("<i>{player.jumperNumber??'—'}</i></>", "<i>{player.jumperNumber??'—'}</i>{unavailable&&<em>Unavailable</em>}</>")
          ]
          for old,new in simple:
              if old not in text:
                  raise SystemExit('Expected Select Team snippet was not found: '+old[:70])
              text=text.replace(old,new,1)
          css = ".cas-player-bank.unavailable{border-color:#ff4d57;background:linear-gradient(rgba(154,24,32,.82),rgba(91,10,16,.88)),#142630;box-shadow:inset 0 0 0 1px rgba(255,170,170,.25)}.cas-player-bank.unavailable small{color:#ffd5d8;font-weight:950}.cas-player-bank.unavailable>svg{color:#ffc0c3}.cas-position-card.unavailable{border-color:#ff4d57;background:linear-gradient(rgba(198,34,43,.76),rgba(135,15,23,.82)),#f7f6f1;color:#fff}.cas-position-card.unavailable>span{background:#891018}.cas-position-card.unavailable>em{position:absolute;right:5px;bottom:4px;padding:2px 5px;border-radius:999px;background:#891018;color:#fff;font-size:7px;font-style:normal;font-weight:950;letter-spacing:.04em;text-transform:uppercase}\n"
          marker='@media(max-width:900px)'
          if marker not in text:
              raise SystemExit('Expected media marker was not found')
          frontend.write_text(text.replace(marker,css+marker,1))
          PY
          python /tmp/patch.py
      - name: Verify build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "PlayFooty Automation"
          git config user.email "actions@playfooty.com.au"
          git add backend/src/api/routes/club-team-sheets.ts src/pages/CoachAppSelectSide.tsx
          git commit -m "Show unavailable players in Select Team"
          git push origin HEAD:newone1
