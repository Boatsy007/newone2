name: Add Match Day Live Feed
on:
  push:
    branches: [newone1]
    paths:
      - scripts/add_matchday_live_feed_v3.py
      - .github/workflows/add-matchday-live-feed.yml
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Apply live feed
        run: python scripts/add_matchday_live_feed_v3.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build frontend
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CoachAppMatchDay.tsx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add live Match Day event feed"
          git push origin HEAD:newone1
