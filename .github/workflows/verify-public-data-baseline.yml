name: Verify PlayFooty Public Data

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment URL to verify
        required: true
        default: https://playfooty.com.au
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify public data contract
        run: node scripts/verify-live-public-data.mjs "${{ inputs.base_url }}"
