name: Standardise Coach App Loading
on:
  push:
    paths:
      - 'scripts/apply-shared-coach-app-loading.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply shared loading screen
        run: python scripts/apply-shared-coach-app-loading.py
      - name: Install frontend
        run: npm ci
      - name: Check frontend
        run: npx tsc -b && npx vite build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/components/CoachAppLoading.tsx src/pages/CoachApp*.tsx
          git commit -m 'Use one loading screen across the Coach App' || exit 0
          git push origin HEAD:newone1
