name: Fix Stage 3 club brand columns
on:
  push:
    paths:
      - .github/workflows/fix-stage3-club-brand-columns.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - name: Fix canonical Club raw SQL column names
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/src/api/routes/club-supporter-memberships.ts')
          s=p.read_text()
          s=s.replace('cl.logo_url AS "logoUrl",cl.primary_colour AS "primaryColour",cl.secondary_colour AS "secondaryColour"','cl."logoUrl" AS "logoUrl",cl."primaryColour" AS "primaryColour",cl."secondaryColour" AS "secondaryColour"')
          p.write_text(s)
          PY
      - run: |
          git config user.name "playfooty-build"
          git config user.email "actions@users.noreply.github.com"
          git add backend/src/api/routes/club-supporter-memberships.ts
          git diff --cached --quiet || git commit -m "Fix membership card canonical club brand columns"
          git push origin HEAD:newone1
