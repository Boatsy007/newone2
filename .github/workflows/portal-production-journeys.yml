name: Portal production journeys

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_DISPOSABLE_PORTAL_TESTS to confirm disposable production account testing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portal-production-journeys
  cancel-in-progress: false

jobs:
  portal-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-portal-testing
    env:
      PORTAL_E2E_CONFIRM: ${{ inputs.confirmation }}
      PORTAL_E2E_BASE_URL: ${{ secrets.PORTAL_E2E_BASE_URL }}
      PORTAL_E2E_CLUB_ID: ${{ secrets.PORTAL_E2E_CLUB_ID }}
      PORTAL_E2E_LEAGUE_ID: ${{ secrets.PORTAL_E2E_LEAGUE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Require explicit confirmation
        run: test "$PORTAL_E2E_CONFIRM" = "RUN_DISPOSABLE_PORTAL_TESTS"

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Generate Prisma client
        run: npm --prefix backend run db:generate

      - name: Install Chromium
        run: npx --prefix backend playwright install --with-deps chromium

      - name: Run real Club and League Portal journeys
        run: node backend/scripts/portal-production-journey.mjs
