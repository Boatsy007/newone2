name: Connect Coach App Training Plan
on:
  push:
    paths:
      - '.github/workflows/connect-coach-app-training-plan.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Connect training plan
        run: python .github/scripts/connect_coach_training_plan.py
      - name: Build
        run: npm ci && npm --prefix backend ci && npm run build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachApp.tsx
          git commit -m 'Connect app training plan to Match Flow'
          git push origin newone1
