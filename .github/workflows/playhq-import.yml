name: PlayHQ Import

# Import a league from a pasted PlayHQ URL, sync a single league,
# or sync every league that has a stored PlayHQ URL.
# Runs pending Prisma migrations, installs Playwright/Chromium,
# writes ladder data to the database, uploads diagnostics, and re-ranks nationally.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'PlayHQ URL to import. Leave blank to sync instead.'
        required: false
        default: ''
        type: string

      sync_league_id:
        description: 'Sync a single league by its ID. Leave blank for none.'
        required: false
        default: ''
        type: string

      sync_all:
        description: 'Sync every league that has a stored PlayHQ URL.'
        required: false
        default: false
        type: boolean

      dry_run:
        description: 'Dispatch/connectivity dry run with no scraper import.'
        required: false
        default: false
        type: boolean

jobs:
  import:
    name: PlayHQ ladder import / sync + rank
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
      PLAYFOOTY_RENDER_PLAYHQ: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply pending Prisma migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Install Playwright Chromium
        working-directory: backend
        run: npx playwright install chromium --with-deps

      - name: Enforce ladder-only import behaviour
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/jobs/playhq-url-import.ts')
          text = path.read_text()

          old_guard = """  if (ladder.rows.length === 0) {
            await recordFootballImport(null, 'LADDER', ladderUrl, ladder.rows.length, 0, ladder.confidence, 'FAILED', { warnings: ladder.warnings, strategy: ladder.strategy }, 'No ladder rows parsed from PlayHQ ladder URL')
            return { ...report, status: 'NO_DATA', error: `No ladder rows parsed from ${ladderUrl}: ${ladder.warnings.join('; ') || 'unknown parser failure'}` }
          }
"""
          new_guard = """  if (ladder.rows.length < 4) {
            const error = `Only ${ladder.rows.length} valid ladder row(s) parsed; at least 4 are required. No database changes were made.`
            await recordFootballImport(null, 'LADDER', ladderUrl, ladder.rows.length, 0, ladder.confidence, 'FAILED', { warnings: ladder.warnings, strategy: ladder.strategy }, error)
            return { ...report, status: 'NO_DATA', error }
          }
"""
          if old_guard not in text:
            raise SystemExit('Expected ladder validation block was not found; refusing to run.')
          text = text.replace(old_guard, new_guard, 1)

          start_marker = "  const roundUrls = discoverRoundUrls(baseUrl, ladderPage.body)\n"
          end_marker = "  await prisma.league.update({ where: { id: league.id }, data: { ...visibleFootballLeagueFields, syncStatus: 'SUCCESS'"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit('Expected fixture/result round-scraping block was not found; refusing to run.')

          text = text[:start] + "  console.log('[playhq-football] ladder-only import complete; fixture/result round scraping skipped')\n\n" + text[end:]

          old_log = "  console.log(`[playhq-football] database records written: ladder=${ladderWritten} fixtures=${fixturesWritten} results=${resultsWritten} rankings=${report.rankingRecalculated}`)"
          new_log = "  console.log(`[playhq-football] database records written: ladder=${ladderWritten} rankings=${report.rankingRecalculated}`)"
          if old_log not in text:
            raise SystemExit('Expected final football import log was not found; refusing to run.')
          text = text.replace(old_log, new_log, 1)

          path.write_text(text)
          PY

      - name: Run PlayHQ ladder import or sync
        working-directory: backend
        env:
          IMPORT_URL: ${{ inputs.url }}
          SYNC_ID: ${{ inputs.sync_league_id }}
          SYNC_ALL: ${{ inputs.sync_all }}
          DRY_RUN: ${{ inputs.dry_run }}
          PLAYFOOTY_ARTIFACT_DIR: ../artifacts/playhq
        run: |
          if [ -n "$IMPORT_URL" ]; then
            npx tsx src/jobs/playhq-url-import-trigger.ts "--url=$IMPORT_URL"
          elif [ -n "$SYNC_ID" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              npx tsx src/jobs/playhq-url-import-trigger.ts "--sync=$SYNC_ID" --dry-run
            else
              npx tsx src/jobs/playhq-url-import-trigger.ts "--sync=$SYNC_ID"
            fi
          elif [ "$SYNC_ALL" = "true" ]; then
            npx tsx src/jobs/playhq-url-import-trigger.ts --sync-all
          else
            echo "Nothing to do — provide url, sync_league_id, or sync_all."
            exit 1
          fi

      - name: Upload PlayHQ diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playhq-url-import-diagnostics
          path: artifacts/playhq
          if-no-files-found: ignore
