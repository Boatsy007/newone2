name: Add Whiteboard Player Library
'on':
  push:
    paths:
      - '.github/workflows/add-whiteboard-player-library.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - name: Apply player library UI
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build production app
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CoachAppWhiteboardStage2.tsx
          git commit -m "Make whiteboard player placement flexible"
          git push origin HEAD:newone1
