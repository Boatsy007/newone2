name: Run Training Focus Update
on:
  push:
    paths:
      - 'scripts/apply-training-focus-options.py'
      - '.github/workflows/run-training-focus-update.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply-training-focus-options.py
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run build
      - run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachAppTrainingPlan.tsx
          git commit -m 'Simplify training plan with multi-select focus options' || exit 0
          git push origin HEAD:newone1
