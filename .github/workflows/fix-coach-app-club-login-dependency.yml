name: Fix Coach App Club Login Dependency
on:
  push:
    branches: [newone1]
    paths:
      - '.github/workflows/fix-coach-app-club-login-dependency.yml'
      - '.github/scripts/fix_coach_app_club_login_dependency.py'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - run: python .github/scripts/fix_coach_app_club_login_dependency.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CoachApp.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Allow authorised clubs to open without a team sheet"
          git restore backend/prisma/schema.prisma || true
          git pull --rebase origin newone1
          git push origin HEAD:newone1
