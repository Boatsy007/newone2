name: Add Coach App Club Dashboard
on:
  push:
    paths:
      - 'scripts/add-club-dashboard-entry.py'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire Club Dashboard
        run: python scripts/add-club-dashboard-entry.py
      - name: Install frontend
        run: npm ci
      - name: Check frontend
        run: npx tsc -b && npx vite build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachApp.tsx
          git commit -m 'Open Coach App through Club Dashboard' || exit 0
          git push origin HEAD:newone1
