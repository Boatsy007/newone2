name: Match Day Field Wrapper
on:
  push:
    branches: [newone1]
    paths:
      - .github/workflows/match-matchday-field-wrapper.yml
      - .github/scripts/apply_matchday_wrapper.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - name: Apply field wrapper
        run: python3 .github/scripts/apply_matchday_wrapper.py
      - name: Commit change
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachAppMatchDay.tsx
          git commit -m 'Use Select Side field wrapper in Match Day'
          git push origin newone1
