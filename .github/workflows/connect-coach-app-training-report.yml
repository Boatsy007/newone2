name: Connect Coach App Training Report
on:
  push:
    paths:
      - '.github/workflows/connect-coach-app-training-report.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Connect training report
        run: python .github/scripts/connect_coach_training_report.py
      - name: Install and build
        run: npm ci && npm --prefix backend ci && npm run build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachApp.tsx backend/src/api/routes/club-training-attendance.ts backend/src/server.ts
          git commit -m 'Connect complete app training report'
          git push origin newone1
