name: One-time ladder-only importer fix

on:
  push:
    branches:
      - newone1
    paths:
      - .github/workflows/one-time-ladder-only-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out newone1
        uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0

      - name: Make pasted ladder URLs ladder-only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/src/jobs/playhq-url-import.ts')
          text = path.read_text()

          old_guard = """  if (ladder.rows.length === 0) {
            await recordFootballImport(null, 'LADDER', ladderUrl, ladder.rows.length, 0, ladder.confidence, 'FAILED', { warnings: ladder.warnings, strategy: ladder.strategy }, 'No ladder rows parsed from PlayHQ ladder URL')
            return { ...report, status: 'NO_DATA', error: `No ladder rows parsed from ${ladderUrl}: ${ladder.warnings.join('; ') || 'unknown parser failure'}` }
          }
"""
          new_guard = """  if (ladder.rows.length < 4) {
            const error = `Only ${ladder.rows.length} valid ladder row(s) parsed; at least 4 are required. No database changes were made.`
            await recordFootballImport(null, 'LADDER', ladderUrl, ladder.rows.length, 0, ladder.confidence, 'FAILED', { warnings: ladder.warnings, strategy: ladder.strategy }, error)
            return { ...report, status: 'NO_DATA', error }
          }
"""
          if old_guard not in text:
            raise SystemExit('Expected ladder validation block was not found; refusing to edit.')
          text = text.replace(old_guard, new_guard, 1)

          start_marker = "  const roundUrls = discoverRoundUrls(baseUrl, ladderPage.body)\n"
          end_marker = "  await prisma.league.update({ where: { id: league.id }, data: { ...visibleFootballLeagueFields, syncStatus: 'SUCCESS'"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit('Expected fixture/result round-scraping block was not found; refusing to edit.')
          replacement = "  console.log('[playhq-football] ladder-only import complete; fixture/result round scraping skipped')\n\n"
          text = text[:start] + replacement + text[end:]

          old_log = "  console.log(`[playhq-football] database records written: ladder=${ladderWritten} fixtures=${fixturesWritten} results=${resultsWritten} rankings=${report.rankingRecalculated}`)"
          new_log = "  console.log(`[playhq-football] database records written: ladder=${ladderWritten} rankings=${report.rankingRecalculated}`)"
          if old_log not in text:
            raise SystemExit('Expected final football import log was not found; refusing to edit.')
          text = text.replace(old_log, new_log, 1)

          text = text.replace(
            '// ─── Football direct import: PlayHQ AFL ladder URL → league, clubs, ladder, rounds ──',
            '// ─── Football direct import: PlayHQ AFL ladder URL → league, clubs and ladder ──',
            1,
          )

          path.write_text(text)
          PY

      - name: Verify build
        run: |
          npm ci
          npm --prefix backend ci
          npm run build

      - name: Commit fix and remove one-time workflow
        run: |
          rm .github/workflows/one-time-ladder-only-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/jobs/playhq-url-import.ts .github/workflows/one-time-ladder-only-fix.yml
          git diff --cached --check
          git commit -m "fix: keep pasted PlayHQ ladder imports ladder-only"
          git push origin HEAD:newone1
