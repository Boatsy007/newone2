name: Fix Whiteboard Horizontal Layout
on:
  push:
    paths:
      - '.github/workflows/fix-whiteboard-horizontal-layout.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - name: Apply horizontal Whiteboard repair
        run: python3 scripts/fix_whiteboard_horizontal_layout.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build production app
        run: npm run build
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CoachAppWhiteboardStage2.tsx
          git commit -m "Fix Whiteboard horizontal layout and player controls" || exit 0
          git push origin HEAD:newone1
