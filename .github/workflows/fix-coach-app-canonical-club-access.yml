name: Fix Coach App Canonical Club Access
on:
  push:
    branches: [newone1]
    paths:
      - '.github/workflows/fix-coach-app-canonical-club-access.yml'
      - '.github/scripts/fix_coach_app_canonical_club_access.py'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - run: python .github/scripts/fix_coach_app_canonical_club_access.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm --prefix backend ci
      - run: npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore backend/prisma/schema.prisma || true
          git add backend/src/auth/club-auth.ts backend/src/api/routes/coach-app.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix Coach App canonical club access"
          git pull --rebase --autostash origin newone1
          git push origin HEAD:newone1
