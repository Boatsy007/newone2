name: Build ChatGPT Match Reports
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add AI match report workflow
        run: python scripts/add-ai-match-report.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Check frontend
        run: npx tsc -b && npx vite build
      - name: Check backend
        run: npm --prefix backend run build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachAppMatchDay.tsx backend/api/index.ts backend/.env.example
          git commit -m 'Generate branded AI quarter and match reports' || exit 0
          git push origin HEAD:newone1
