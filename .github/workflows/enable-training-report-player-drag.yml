name: Add Match Day KPI Assistant Buttons
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Match Day buttons
        run: python scripts/add-match-day-kpi-assistant-buttons.py
      - name: Install frontend
        run: npm ci
      - name: Check frontend
        run: npx tsc -b && npx vite build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachAppMatchDay.tsx
          git commit -m 'Add Set KPIs and Assistant Coach Match Day buttons' || exit 0
          git push origin HEAD:newone1
