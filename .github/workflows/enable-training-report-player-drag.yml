name: Connect Canonical Coach App Fixture Flow
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Connect canonical fixture flow
        run: python scripts/connect-coach-app-canonical-fixture-flow.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add backend/src/api/routes/coach-app.ts src/pages/CoachApp.tsx src/pages/CoachAppGamePlan.tsx
          git commit -m 'Connect Match Flow to canonical upcoming fixture' || exit 0
          git push origin HEAD:newone1
