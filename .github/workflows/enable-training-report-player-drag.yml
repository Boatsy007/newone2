name: Build Portrait Match Day KPI Sidebar
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply portrait KPI sidebar layout
        run: python scripts/set-match-day-portrait-kpi-sidebar.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachAppMatchDay.tsx
          git commit -m 'Use Select Side layout with KPI sidebar on portrait Match Day' || exit 0
          git push origin HEAD:newone1
