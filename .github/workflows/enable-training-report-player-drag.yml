name: Build ChatGPT Match Reports
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add AI match report workflow
        run: python scripts/add-ai-match-report.py
      - name: Remove obsolete Full Stats prop
        run: python scripts/fix-ai-match-report-prop.py
      - name: Move Match Day tools under KPIs
        run: python scripts/move-match-day-tools-under-kpis.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Check frontend
        run: npx tsc -b && npx vite build
      - name: Check Match Report backend route
        run: cd backend && npx tsx -e "import('./src/api/routes/match-report.ts').then(() => console.log('Match Report route loaded'))"
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachApp.tsx src/pages/CoachAppMatchDay.tsx backend/api/index.ts backend/.env.example
          git commit -m 'Move Game Plan and Whiteboard under Live KPIs' || exit 0
          git push origin HEAD:newone1
