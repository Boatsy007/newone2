name: Connect Live Match Return Navigation
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Connect return navigation
        run: python scripts/add-live-match-return-navigation.py
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm --prefix backend ci
      - name: Build
        run: npm run build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachApp.tsx src/pages/CoachAppGamePlan.tsx src/pages/ClubPortalWhiteboard.tsx
          git commit -m 'Return Game Plan and Whiteboard to live Match Day' || exit 0
          git push origin HEAD:newone1
