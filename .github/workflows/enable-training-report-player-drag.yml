name: Fix Coach App Stats Live Sheet
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fix Stats live sheet resolution
        run: python scripts/fix-coach-app-stats-live-sheet.py
      - name: Install frontend
        run: npm ci
      - name: Check frontend
        run: npx tsc -b && npx vite build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachApp.tsx src/pages/CoachAppStats.tsx
          git commit -m 'Fix Coach App Stats connection to active live team sheet' || exit 0
          git push origin HEAD:newone1
