name: Connect Coach App Live Stats
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Connect live stats page
        run: python scripts/connect-coach-app-live-stats.py
      - name: Install frontend
        run: npm ci
      - name: Check frontend
        run: npx tsc -b && npx vite build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachApp.tsx src/pages/CoachAppMatchDay.tsx
          git commit -m 'Connect Coach App live stats recorder to Match Day' || exit 0
          git push origin HEAD:newone1
