name: Fix Live KPI Save Collision
on:
  push:
    paths:
      - '.github/workflows/enable-training-report-player-drag.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Preserve live KPI stats during Match Day saves
        run: python scripts/fix-live-kpi-save-collision.py
      - name: Install frontend
        run: npm ci
      - name: Check frontend
        run: npx tsc -b && npx vite build
      - name: Commit
        run: |
          git config user.name 'PlayFooty Automation'
          git config user.email 'actions@playfooty.com.au'
          git add src/pages/CoachAppMatchDay.tsx
          git commit -m 'Preserve live KPI updates during Match Day autosave' || exit 0
          git push origin HEAD:newone1
