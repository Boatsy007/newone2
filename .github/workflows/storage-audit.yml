name: Storage audit
on:
  push:
    paths:
      - '.github/workflows/storage-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find browser storage usage
        run: |
          python - <<'PY'
          from pathlib import Path
          terms=('localStorage','sessionStorage','indexedDB','document.cookie')
          out=[]
          for p in Path('.').rglob('*'):
            if not p.is_file() or any(x in p.parts for x in ('.git','node_modules','dist','build')):
              continue
            try: lines=p.read_text(errors='ignore').splitlines()
            except Exception: continue
            for i,line in enumerate(lines,1):
              if any(t in line for t in terms):
                out.append(f'{p}:{i}:{line.strip()}')
          Path('storage-audit.txt').write_text('\n'.join(out)+'\n')
          PY
      - name: Commit report
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add storage-audit.txt
          git commit -m 'Add browser storage audit report' || exit 0
          git push
