name: Group Whiteboard Drawing Tools
on:
  push:
    branches: [newone1]
    paths:
      - '.github/scripts/group_whiteboard_drawing_tools.py'
      - '.github/workflows/group-whiteboard-drawing-tools.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: newone1
          fetch-depth: 0
      - name: Apply grouped drawing tools
        run: python .github/scripts/group_whiteboard_drawing_tools.py
      - name: Correct generated drawing tray JSX
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('src/pages/CoachAppWhiteboardStage2.tsx')
          text=path.read_text()
          text=text.replace('</label>}</div><button className="draw-close"','</label></>}</div><button className="draw-close"',1)
          path.write_text(text)
          PY
      - name: Install frontend
        run: npm ci
      - name: Install backend
        run: npm ci
        working-directory: backend
      - name: Build production app
        run: npm run build
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/CoachAppWhiteboardStage2.tsx
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Group Whiteboard drawing tools and add shapes'
            git push origin newone1
          fi
